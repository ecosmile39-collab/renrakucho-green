<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワード再設定 - 連絡帳アプリ</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f8ff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .box { background: white; width: 100%; max-width: 440px; padding: 35px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); box-sizing: border-box; }
        h1 { color: #4682b4; font-size: 24px; text-align: center; margin: 0 0 14px; }
        p { color: #495057; line-height: 1.6; }
        label { display: block; font-weight: bold; margin-top: 14px; color: #495057; }
        input { width: 100%; padding: 12px; margin-top: 6px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 14px; margin-top: 22px; background: #ff7f50; color: white; border: 0; border-radius: 5px; font-size: 17px; font-weight: bold; cursor: pointer; }
        button:disabled { opacity: .65; cursor: wait; }
        .note { padding: 12px; background: #f4f8ff; border-left: 4px solid #1c7ed6; font-size: 13px; }
        .message { display: none; margin-top: 15px; font-weight: bold; line-height: 1.5; }
        .error { color: #c92a2a; }
        .success { color: #2b8a3e; }
        .back { display: block; margin-top: 20px; text-align: center; color: #4682b4; font-weight: bold; text-decoration: none; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <main class="box">
        <h1>🔒 パスワードを再設定</h1>
        <p class="note">施設名と登録済みの連絡先メールアドレスを入力してください。一致する場合、そのメールアドレスへ確認コードを送信します。コードの有効期限は10分です。</p>
        <section id="requestSection">
            <label for="facilityName">施設名</label>
            <input type="text" id="facilityName" autocomplete="organization" maxlength="200" required>
            <label for="email">登録済みメールアドレス</label>
            <input type="email" id="email" autocomplete="email" maxlength="254" required>
            <button type="button" id="requestButton">確認コードを送信</button>
        </section>
        <section id="resetSection" hidden>
            <p id="requestMessage" class="message success" role="status"></p>
            <label for="code">メールに届いた6桁の確認コード</label>
            <input type="text" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
            <label for="newPassword">新しいパスワード（6文字以上）</label>
            <input type="password" id="newPassword" autocomplete="new-password" maxlength="200">
            <label for="confirmPassword">新しいパスワード（確認）</label>
            <input type="password" id="confirmPassword" autocomplete="new-password" maxlength="200">
            <button type="button" id="resetButton">新しいパスワードを設定</button>
        </section>
        <p id="message" class="message" role="status" aria-live="polite"></p>
        <a href="login.html" class="back">⬅ ログイン画面へ戻る</a>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-functions.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCLExSyJnb5zvjMbGXv7EsCGFYQf9WZeYg",
            authDomain: "renrakucho-app-6b157.firebaseapp.com",
            projectId: "renrakucho-app-6b157",
            storageBucket: "renrakucho-app-6b157.firebasestorage.app",
            messagingSenderId: "63418706991",
            appId: "1:63418706991:web:43085ce485d2a3d6302ada"
        };
        const functions = getFunctions(initializeApp(firebaseConfig));
        const requestReset = httpsCallable(functions, "requestFacilityPasswordReset");
        const completeReset = httpsCallable(functions, "completeFacilityPasswordReset");
        const requestButton = document.getElementById("requestButton");
        const resetButton = document.getElementById("resetButton");
        let challengeId = "";

        function showMessage(text, type) {
            const message = document.getElementById("message");
            message.textContent = text;
            message.className = `message ${type}`;
            message.style.display = "block";
        }

        function showFunctionError(error, fallback) {
            if (error.code === "functions/resource-exhausted") {
                showMessage(error.message || "確認コードの送信回数が上限に達しました。時間をおいて再度お試しください。", "error");
            } else if (error.code === "functions/invalid-argument") {
                showMessage(error.message || fallback, "error");
            } else if (error.code === "functions/unavailable" || error.code === "functions/internal") {
                showMessage("処理に失敗しました。通信状況を確認し、しばらくしてから再度お試しください。", "error");
            } else {
                showMessage(fallback, "error");
            }
        }

        requestButton.addEventListener("click", async () => {
            const facilityName = document.getElementById("facilityName").value.trim();
            const email = document.getElementById("email").value.trim();
            if (!facilityName || !email) {
                showMessage("施設名と登録済みメールアドレスを入力してください。", "error");
                return;
            }
            requestButton.disabled = true;
            try {
                const result = await requestReset({ facilityName, email });
                challengeId = result.data.challengeId;
                document.getElementById("requestSection").hidden = true;
                document.getElementById("resetSection").hidden = false;
                const requestMessage = document.getElementById("requestMessage");
                requestMessage.textContent = "入力内容が登録情報と一致する場合、登録済みメールアドレスへ確認コードを送信しました。メールをご確認ください。";
                requestMessage.style.display = "block";
                document.getElementById("code").focus();
                showMessage("", "success");
            } catch (error) {
                showFunctionError(error, "確認コードを送信できませんでした。しばらくしてから再度お試しください。");
            } finally {
                requestButton.disabled = false;
            }
        });

        resetButton.addEventListener("click", async () => {
            const code = document.getElementById("code").value.trim();
            const newPassword = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            if (!/^\d{6}$/.test(code)) {
                showMessage("メールに届いた6桁の確認コードを入力してください。", "error");
                return;
            }
            if (newPassword.length < 6 || newPassword.length > 200) {
                showMessage("新しいパスワードは6文字以上200文字以内で入力してください。", "error");
                return;
            }
            if (newPassword !== confirmPassword) {
                showMessage("新しいパスワードが一致しません。", "error");
                return;
            }
            resetButton.disabled = true;
            try {
                await completeReset({ challengeId, code, newPassword });
                document.getElementById("resetSection").hidden = true;
                document.getElementById("requestSection").hidden = true;
                showMessage("パスワードを再設定しました。新しいパスワードでログインしてください。", "success");
            } catch (error) {
                showFunctionError(error, "確認コードが正しくないか、有効期限が切れています。最初からやり直してください。");
            } finally {
                resetButton.disabled = false;
            }
        });
    </script>
</body>
</html>
