<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>過去データ一覧（グリーンアンドリバーホーム版）</title>
    
    <style>
        body { font-family: sans-serif; background-color: #f0f8ff; padding: 20px; margin: 0; color: #333; }
        .form-box { background-color: white; padding: 20px; border-radius: 10px; max-width: 800px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #2b8a3e; margin-top: 0; display: flex; align-items: center; gap: 10px; }
        
        .nav-links { text-align: center; margin-bottom: 20px; }
        .nav-links a { color: #2b8a3e; font-weight: bold; text-decoration: none; margin: 0 15px; font-size: 16px; }
        .nav-links a:hover { text-decoration: underline; }

        .filter-panel { background-color: #ebfbee; padding: 20px; border-radius: 8px; border: 2px solid #40c057; margin-bottom: 20px; text-align: center; }
        .filter-select { font-size: 16px; padding: 8px 12px; border-radius: 5px; border: 1px solid #40c057; font-weight: bold; margin-right: 15px; }
        .month-input { font-size: 16px; padding: 8px; border-radius: 5px; border: 1px solid #ccc; margin-right: 15px; }
        .btn-search { background-color: #3b5bdb; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-search:hover { background-color: #364fc7; }

        .user-select-box { background-color: #fff; padding: 20px; border-radius: 8px; border: 1px solid #ccc; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .user-checkbox-wrapper { display: flex; flex-wrap: wrap; gap: 15px; margin-top: 15px; margin-bottom: 20px; }
        .user-checkbox-label { cursor: pointer; font-size: 16px; padding: 6px 12px; border: 1px solid #eee; border-radius: 5px; background-color: #f9f9f9; display: flex; align-items: center; gap: 6px; }
        .user-checkbox-label:hover { background-color: #e6f2ff; border-color: #2b8a3e; }

        .btn-show { background-color: #f76707; color: white; font-size: 18px; padding: 12px 24px; width: 100%; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-show:hover { background-color: #e8590c; }

        .result-area { margin-top: 30px; }
        .user-card { background-color: white; border: 2px solid #2b8a3e; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .user-card h3 { background-color: #e8f5e9; margin: -20px -20px 15px -20px; padding: 15px 20px; border-radius: 6px 6px 0 0; color: #2e7d32; border-bottom: 1px solid #c8e6c9; }
        
        table.history-table { width: 100%; border-collapse: collapse; font-size: 14px; margin-bottom: 15px; }
        table.history-table th, table.history-table td { border: 1px solid #ccc; padding: 8px; text-align: center; }
        table.history-table th { background-color: #f8f9fa; color: #495057; font-weight: bold; }
        table.history-table tr:nth-child(even) { background-color: #fdfdfd; }
        
        .empty-msg { text-align: center; color: red; font-weight: bold; padding: 20px; }

        .csv-export-panel { margin: 24px 0; padding: 20px 0; border-top: 1px solid #ced4da; border-bottom: 1px solid #ced4da; }
        .csv-export-panel h3 { margin: 0 0 16px; color: #2b8a3e; font-size: 18px; }
        .csv-export-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
        .csv-export-fields label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: bold; min-width: 0; }
        .csv-export-fields input, .csv-export-fields select { width: 100%; box-sizing: border-box; min-width: 0; padding: 9px; font-size: 16px; border: 1px solid #adb5bd; border-radius: 4px; }
        .csv-export-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
        .csv-export-actions button { padding: 10px 14px; border: 0; border-radius: 4px; background: #2b8a3e; color: white; font-size: 15px; font-weight: bold; cursor: pointer; }
        .csv-export-actions button:disabled { opacity: 0.55; cursor: wait; }
        #csvExportStatus { min-height: 24px; margin: 12px 0 0; color: #495057; font-size: 14px; overflow-wrap: anywhere; }
        @media (max-width: 520px) {
            .csv-export-panel { padding-right: 60px; }
            .csv-export-fields { grid-template-columns: minmax(0, 1fr); }
            .csv-export-actions button { flex: 1 1 100%; }
        }
        
        .scroll-btn-group { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 1000; }
        .scroll-btn { background-color: #2b8a3e; color: white; border: none; border-radius: 50%; width: 50px; height: 50px; font-size: 24px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); display: flex; justify-content: center; align-items: center; opacity: 0.8; }
    </style>
</head>
<body>
    <div class="form-box">
        <div class="nav-links">
            <a href="index.html">⬅ 入力画面へ戻る</a>
            <a href="print.html">➡ 印刷画面へ</a>
        </div>
        
        <h2 style="justify-content: center; background-color: #4682b4; color: white; padding: 15px; border-radius: 5px; margin-bottom: 20px;">
            📊 過去データ一覧（1ヶ月のまとめ）
        </h2>

        <div class="filter-panel">
            <select id="selectServiceType" class="filter-select" onchange="clearResults()">
                <option value="デイサービス">☀️ デイサービス</option>
                <option value="ショートステイ" selected>🌙 ショートステイ</option>
                <option value="放課後等デイサービス">🎒 放課後等デイサービス</option>
                <option value="児童発達支援">🧸 児童発達支援</option>
                <option value="生活介護">♿ 生活介護</option>
            </select>
            <input type="month" id="targetMonth" class="month-input">
            <button class="btn-search" onclick="searchData()">この月のデータを探す</button>
            <button class="btn-show" id="auditResultsBtn" onclick="showAuditResults()" style="display: none; background-color: #7950f2;">📚 月別監査保存用一覧を表示</button>
        </div>

        <section class="csv-export-panel" aria-labelledby="csvExportTitle">
            <h3 id="csvExportTitle">CSV出力</h3>
            <div class="csv-export-fields">
                <label>施設<select id="csvFacility" disabled><option value="">施設確認中...</option></select></label>
                <label>利用者<select id="csvUser"><option value="">すべての利用者</option></select></label>
                <label>開始日<input type="date" id="csvStartDate" required></label>
                <label>終了日<input type="date" id="csvEndDate" required></label>
                <label>サービス<select id="csvService" onchange="onCsvServiceChanged()">
                    <option value="デイサービス">デイサービス</option>
                    <option value="ショートステイ">ショートステイ</option>
                    <option value="放課後等デイサービス">放課後等デイサービス</option>
                    <option value="児童発達支援">児童発達支援</option>
                    <option value="生活介護">生活介護</option>
                </select></label>
            </div>
            <div class="csv-export-actions">
                <button type="button" id="exportRosterButton" onclick="exportRosterCsv()" disabled>📥 利用者名簿CSV</button>
                <button type="button" id="exportRecordsButton" onclick="exportRecordsCsv()" disabled>📥 指定期間の記録CSV</button>
            </div>
            <p id="csvExportStatus" role="status" aria-live="polite"></p>
        </section>

        <div class="user-select-box" id="userSelectBox" style="display: none;">
            <div style="font-weight: bold; color: #1c7ed6; margin-bottom: 10px;">☑ まとめを作成するお客様を選んでください</div>
            <label style="font-weight: bold; border-bottom: 1px dashed #ccc; padding-bottom: 10px; display: block; cursor: pointer; margin-bottom: 15px;">
                <input type="checkbox" id="checkAll" checked onchange="toggleAllUsers()"> すべて選択／解除
            </label>
            <div class="user-checkbox-wrapper" id="userCheckboxes"></div>
            <button class="btn-show" onclick="showResults()">📄 選んだ人のまとめを画面に表示する</button>
            <button class="btn-show" id="printUserResultsBtn" onclick="printUserResults()" style="display: none; background-color: #e65100;">🖨️ 選んだ人のまとめを印刷する</button>
        </div>

        <div class="user-select-box" id="staffSelectBox" style="display: none;">
            <div style="font-weight: bold; color: #2b8a3e; margin-bottom: 10px;">👤 担当スタッフ別の介護日誌</div>
            <select id="selectCareStaff" class="filter-select"></select>
            <button class="btn-show" onclick="showStaffResults()">📋 担当者別に介護日誌を表示する</button>
            <button class="btn-show" id="printStaffResultsBtn" onclick="printStaffResults()" style="display: none; background-color: #e65100;">🖨️ 担当者別の介護日誌を印刷する</button>
        </div>

        <div class="user-select-box" id="auditSelectBox" style="display: none;">
            <div style="font-weight: bold; color: #7950f2; margin-bottom: 10px;">📚 月別監査保存用一覧</div>
            <p style="margin: 0; color: #495057;">指定した月の利用記録と介護日誌を、自治体提出・監査保管用にまとめて表示します。</p>
            <button class="btn-show" id="printAuditResultsBtn" onclick="printAuditResults()" style="background-color: #5f3dc4;">🖨️ 月別監査保存用一覧を印刷・PDF保存</button>
        </div>

        <div id="resultArea" class="result-area"></div>
    </div>

    <div class="scroll-btn-group" id="scrollGroup">
        <button class="scroll-btn" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">▲</button>
        <button class="scroll-btn" onclick="window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'})">▼</button>
    </div>

    <script type="importmap">
        { "imports": { "papaparse": "https://cdn.jsdelivr.net/npm/papaparse@5.5.3/+esm" } }
    </script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { hasFacilitySession } from "./facility-auth.js";
        import { getFirestore, collection, getDocs, query, where, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { createCsv, rosterTable, selectUsers, selectRecords, recordsTable } from "./csv-export.js";
        import { normalizeServiceTypes, populateServiceTypeSelect } from "./service-types.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCLExSyJnb5zvjMbGXv7EsCGFYQf9WZeYg",
            authDomain: "renrakucho-app-6b157.firebaseapp.com",
            projectId: "renrakucho-app-6b157",
            storageBucket: "renrakucho-app-6b157.firebasestorage.app",
            messagingSenderId: "63418706991",
            appId: "1:63418706991:web:43085ce485d2a3d6302ada"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.matchedRecordsGlobal = [];
        let currentHistoryView = "";
        let exportUsers = [];

        window.onload = async function() {
            let facilityId = localStorage.getItem("currentFacilityId");
            if (!facilityId) { window.location.replace("login.html"); return; }
            if (!(await hasFacilitySession(auth, facilityId))) {
                localStorage.removeItem("currentFacilityId");
                localStorage.removeItem("currentFacilityName");
                localStorage.removeItem("isStaffAuthenticated");
                window.location.replace("login.html");
                return;
            }
            
            let today = new Date();
            let year = today.getFullYear();
            let month = String(today.getMonth() + 1).padStart(2, '0');
            document.getElementById("targetMonth").value = `${year}-${month}`;
            
            document.getElementById("csvStartDate").value = `${year}-${month}-01`;
            document.getElementById("csvEndDate").value = `${year}-${month}-${String(today.getDate()).padStart(2, "0")}`;
            try {
                const facility = await requireExportFacility();
                const savedServiceType = localStorage.getItem("currentServiceType");
                const selectedServiceType = populateServiceTypeSelect(
                    document.getElementById("selectServiceType"),
                    facility.enabledServiceTypes,
                    savedServiceType
                );
                populateServiceTypeSelect(
                    document.getElementById("csvService"),
                    facility.enabledServiceTypes,
                    selectedServiceType
                );
                localStorage.setItem("currentServiceType", selectedServiceType);
                document.getElementById("csvFacility").replaceChildren(new Option(facility.name, facility.id));
                const users = await getExportUsers(facility.id);
                refreshExportUsers(users);
                setExportBusy(false);
            } catch (error) {
                document.getElementById("csvExportStatus").textContent = `CSV出力の準備に失敗しました。再読み込みしてください：${error.message}`;
            }
        };

        function setExportBusy(busy) {
            document.getElementById("exportRosterButton").disabled = busy;
            document.getElementById("exportRecordsButton").disabled = busy;
            for (const id of ["csvUser", "csvStartDate", "csvEndDate", "csvService"]) {
                document.getElementById(id).disabled = busy;
            }
        }

        async function requireExportFacility() {
            const facilityId = localStorage.getItem("currentFacilityId");
            if (!facilityId || !(await hasFacilitySession(auth, facilityId))) {
                throw new Error("施設にログインし直してください。");
            }
            const snapshot = await getDoc(doc(db, "facilities", facilityId));
            const data = snapshot.exists() ? snapshot.data() : null;
            if (!data || data.status === "locked" || (data.subscriptionStatus === "trial" &&
                !(Date.parse(data.trialEndsAt || "") > Date.now()))) {
                throw new Error("この施設は現在利用できません。");
            }
            return {
                id: facilityId,
                name: data.facilityName || facilityId,
                enabledServiceTypes: normalizeServiceTypes(data.enabledServiceTypes)
            };
        }

        async function getExportUsers(facilityId) {
            const snapshot = await getDocs(collection(db, "facilities", facilityId, "users"));
            return snapshot.docs.map(document => ({ ...document.data(), name: document.id }));
        }

        function refreshExportUsers(users) {
            exportUsers = users;
            const select = document.getElementById("csvUser");
            const selected = select.value;
            select.replaceChildren(new Option("すべての利用者", ""));
            const serviceUsers = selectUsers(users, { serviceType: document.getElementById("csvService").value });
            serviceUsers.sort((first, second) => first.name.localeCompare(second.name, "ja")).forEach(user => {
                select.add(new Option(`${user.name}${user.active === false ? "（利用終了）" : ""}`, user.name));
            });
            select.value = Array.from(select.options).some(option => option.value === selected) ? selected : "";
        }

        window.onCsvServiceChanged = function() {
            document.getElementById("selectServiceType").value = document.getElementById("csvService").value;
            window.clearResults();
        };

        function downloadCsv(table, filename) {
            const blob = new Blob([createCsv(table)], { type: "text/csv;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const anchor = document.createElement("a");
            anchor.href = url;
            anchor.download = filename.replace(/[\\/:*?"<>|\u0000-\u001F]/g, "_");
            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();
            window.setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        window.exportRosterCsv = async function() {
            const status = document.getElementById("csvExportStatus");
            const filters = {
                serviceType: document.getElementById("csvService").value,
                userName: document.getElementById("csvUser").value
            };
            setExportBusy(true);
            status.textContent = "利用者名簿を取得しています...";
            try {
                selectUsers([], filters);
                const facility = await requireExportFacility();
                const users = await getExportUsers(facility.id);
                refreshExportUsers(users);
                const selectedUsers = selectUsers(users, filters);
                if (!selectedUsers.length) { status.textContent = "指定したサービス・利用者の名簿はありません。"; return; }
                if (!confirm(`${facility.name} の【${filters.serviceType}】の利用者名簿（${selectedUsers.length}名・利用終了者を含む）をCSV出力しますか？\n氏名・生年月日を含むため、保存先と取り扱いにご注意ください。`)) {
                    status.textContent = "CSV出力をキャンセルしました。";
                    return;
                }
                downloadCsv(rosterTable(selectedUsers, facility, filters.serviceType), `${facility.name}_${filters.serviceType}_${filters.userName || "全利用者"}_利用者名簿.csv`);
                status.textContent = `${filters.serviceType}の利用者名簿 ${selectedUsers.length}名分のCSVを作成しました。`;
            } catch (error) {
                status.textContent = `CSV出力に失敗しました：${error.message}`;
            } finally {
                setExportBusy(false);
            }
        };

        window.exportRecordsCsv = async function() {
            const status = document.getElementById("csvExportStatus");
            const filters = {
                facilityId: localStorage.getItem("currentFacilityId"),
                startDate: document.getElementById("csvStartDate").value,
                endDate: document.getElementById("csvEndDate").value,
                userName: document.getElementById("csvUser").value,
                serviceType: document.getElementById("csvService").value
            };
            setExportBusy(true);
            status.textContent = "指定期間の記録を取得しています...";
            try {
                selectRecords([], filters);
                const facility = await requireExportFacility();
                if (facility.id !== filters.facilityId) throw new Error("施設を再確認してから出力してください。");
                const recordsQuery = query(collection(db, "facilities", facility.id, "daily_records"),
                    where("date", ">=", filters.startDate), where("date", "<=", filters.endDate));
                const snapshot = await getDocs(recordsQuery);
                const records = selectRecords(snapshot.docs.map(document => document.data()), filters);
                if (!records.length) { status.textContent = "指定条件の記録はありません。"; return; }
                if (!confirm(`${facility.name} の【${filters.serviceType}】の ${filters.startDate} ～ ${filters.endDate} の記録（${records.length}件）をCSV出力しますか？\n健康情報・職員間申し送りを含むため、保存先と取り扱いにご注意ください。`)) {
                    status.textContent = "CSV出力をキャンセルしました。";
                    return;
                }
                downloadCsv(recordsTable(records, facility), `${facility.name}_${filters.userName || "全利用者"}_${filters.serviceType}_${filters.startDate}_${filters.endDate}_記録.csv`);
                status.textContent = `${filters.serviceType}の記録 ${records.length}件のCSVを作成しました。`;
            } catch (error) {
                status.textContent = `CSV出力に失敗しました：${error.message}`;
            } finally {
                setExportBusy(false);
            }
        };

        window.clearResults = function() {
            document.getElementById("csvService").value = document.getElementById("selectServiceType").value;
            refreshExportUsers(exportUsers);
            document.getElementById("csvExportStatus").textContent = "";
            document.getElementById("userSelectBox").style.display = "none";
            document.getElementById("staffSelectBox").style.display = "none";
            document.getElementById("auditSelectBox").style.display = "none";
            document.getElementById("auditResultsBtn").style.display = "none";
            document.getElementById("printUserResultsBtn").style.display = "none";
            document.getElementById("printStaffResultsBtn").style.display = "none";
            document.getElementById("resultArea").innerHTML = "";
            window.matchedRecordsGlobal = [];
            currentHistoryView = "";
        };

        window.searchData = async function() {
            let facilityId = localStorage.getItem("currentFacilityId");
            let targetMonth = document.getElementById("targetMonth").value;
            let sType = document.getElementById("selectServiceType").value;
            
            if (!targetMonth) { alert("月を選択してください。"); return; }

            let startDate = `${targetMonth}-01`;
            let endDate = `${targetMonth}-31`;

            let checkboxesArea = document.getElementById("userCheckboxes");
            let selectBox = document.getElementById("userSelectBox");
            let resultArea = document.getElementById("resultArea");
            
            selectBox.style.display = "block";
            resultArea.innerHTML = "";
            checkboxesArea.innerHTML = `⏳ 検索中...`;

            try {
                let recordsRef = collection(db, "facilities", facilityId, "daily_records");
                let q = query(recordsRef, where("date", ">=", startDate), where("date", "<=", endDate));
                let usersRef = collection(db, "facilities", facilityId, "users");
                let [snapshot, usersSnapshot] = await Promise.all([getDocs(q), getDocs(usersRef)]);
                let servicesByUser = new Map();
                usersSnapshot.forEach(userDoc => {
                    let userData = userDoc.data();
                    let services = Array.isArray(userData.services)
                        ? userData.services
                        : userData.serviceType ? [userData.serviceType] : ["デイサービス"];
                    servicesByUser.set(userDoc.id, services);
                });

                window.matchedRecordsGlobal = [];
                let uniqueUsers = new Set();

                snapshot.forEach(docSnap => {
                    let data = docSnap.data();
                    let recordService = data.serviceType || "デイサービス";
                    let registeredServices = servicesByUser.get(data.userName);
                    let userMatchesService = !registeredServices || registeredServices.includes(sType);
                    if (recordService === sType && userMatchesService) {
                        window.matchedRecordsGlobal.push(data);
                        uniqueUsers.add(data.userName);
                    }
                });

                if (window.matchedRecordsGlobal.length === 0) {
                    checkboxesArea.innerHTML = `<span class="empty-msg">${targetMonth} の【${sType}】のデータはありません。</span>`;
                    return;
                }

                checkboxesArea.innerHTML = "";
                document.getElementById("checkAll").checked = true;
                
                Array.from(uniqueUsers).sort().forEach((userName) => {
                    let lbl = document.createElement("label");
                    lbl.className = "user-checkbox-label";
                    lbl.innerHTML = `<input type="checkbox" class="user-chk" value="${userName}" checked> ${userName} 様`;
                    checkboxesArea.appendChild(lbl);
                });

                let staffSelect = document.getElementById("selectCareStaff");
                let uniqueStaff = Array.from(new Set(window.matchedRecordsGlobal.map(record => record.careStaff || "未入力"))).sort();
                staffSelect.innerHTML = uniqueStaff.map(staff => `<option value="${escapeHtml(staff)}">${escapeHtml(staff)}</option>`).join("");
                document.getElementById("staffSelectBox").style.display = "block";
                document.getElementById("auditResultsBtn").style.display = "block";
                document.getElementById("printUserResultsBtn").style.display = "none";
                document.getElementById("printStaffResultsBtn").style.display = "none";

            } catch (error) {
                checkboxesArea.innerHTML = "検索エラー: " + error.message;
            }
        };

        window.toggleAllUsers = function() {
            let isChecked = document.getElementById("checkAll").checked;
            document.querySelectorAll(".user-chk").forEach(chk => chk.checked = isChecked);
        };

        function escapeHtml(value) {
            return String(value || '').replace(/[&<>'"]/g, char => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[char]));
        }

        window.showResults = function() {
            let resultArea = document.getElementById("resultArea");
            resultArea.innerHTML = "";
            currentHistoryView = "user";
            document.getElementById("printUserResultsBtn").style.display = "block";
            document.getElementById("printStaffResultsBtn").style.display = "none";
            let sType = document.getElementById("selectServiceType").value;

            let chks = document.querySelectorAll(".user-chk:checked");
            if (chks.length === 0) {
                alert("表示するお客様を選んでください。");
                return;
            }
            let selectedUserNames = Array.from(chks).map(chk => chk.value);

            let targetRecords = window.matchedRecordsGlobal.filter(record => selectedUserNames.includes(record.userName));
            targetRecords.sort((a, b) => a.date.localeCompare(b.date));

            let recordsByUser = {};
            selectedUserNames.forEach(name => recordsByUser[name] = []);
            targetRecords.forEach(r => recordsByUser[r.userName].push(r));

            Object.keys(recordsByUser).forEach(userName => {
                let userRecords = recordsByUser[userName];
                if (userRecords.length === 0) return;

                let card = document.createElement("div");
                card.className = "user-card";
                
                let html = `<h3>👤 ${userName} 様 （${userRecords.length}日分）</h3>`;
                
                if (sType === "デイサービス") {
                    html += `<table class="history-table">
                        <tr>
                            <th width="12%">日付</th><th width="10%">体温</th><th width="10%">脈拍</th>
                            <th width="13%">血圧</th><th width="15%">食事(主/副)</th><th width="10%">入浴</th><th width="10%">排泄</th><th width="20%">担当・介護日誌</th>
                        </tr>`;
                    
                    userRecords.forEach(d => {
                        let t = d.temp1 || '--';
                        let p = d.pulse || '--';
                        let bp = (d.bpHigh || '--') + '/' + (d.bpLow || '--');
                        let meal = (d.mealMain || '--') + '/' + (d.mealSub || '--');
                        let bath = d.bath || '--';
                        
                        let bStr = "--";
                        if (d.bowel === "なし") bStr = "なし";
                        else if (d.bowel === "あり") bStr = `あり (${d.bowelCount || ""}/${d.bowelCondition || ""})`;
                        
                        html += `<tr>
                            <td>${d.date.substring(5).replace('-','/')}</td>
                            <td>${t}℃</td><td>${p}</td><td>${bp}</td><td>${meal}</td><td>${bath}</td><td>${bStr}</td>
                            <td style="text-align: left; white-space: pre-wrap;">${escapeHtml(d.careStaff || '--')}<br>${escapeHtml(d.careJournal || '記録なし')}</td>
                        </tr>`;
                    });
                    html += `</table>`;
                } else if (["放課後等デイサービス", "児童発達支援"].includes(sType)) {
                    html += `<table class="history-table">
                        <tr><th>日付</th><th>出欠</th><th>到着／出発</th><th>送迎</th><th>健康・排泄</th><th>活動</th><th>エピソード・家庭連絡</th></tr>`;
                    userRecords.forEach(d => {
                        const transport = [d.afterSchoolPickup, d.afterSchoolDropoff].filter(Boolean).map(escapeHtml).join("<br>") || "--";
                        html += `<tr>
                            <td>${escapeHtml(d.date.substring(5).replace('-', '/'))}</td>
                            <td>${escapeHtml(d.afterSchoolAttendance || "--")}</td>
                            <td>${escapeHtml(d.afterSchoolProvideStart || "--")}〜${escapeHtml(d.afterSchoolProvideEnd || "--")}<br>${escapeHtml(d.afterSchoolArrivalTime || "--")}／${escapeHtml(d.afterSchoolDepartureTime || "--")}</td>
                            <td>${escapeHtml(d.afterSchoolPickupType || "--")} ${transport}<br>${escapeHtml(d.afterSchoolDropoffType || "")}</td>
                            <td>体温 ${escapeHtml(d.afterSchoolTemperature || "--")}℃（${escapeHtml(d.afterSchoolTempTime || "--")}） ${escapeHtml(d.afterSchoolHealth || "")}<br>排泄 ${escapeHtml(d.afterSchoolToiletTime || "--")} ${escapeHtml(d.afterSchoolToilet || "--")}<br>おやつ ${escapeHtml(d.afterSchoolSnackIntake || "--")}</td>
                            <td style="text-align:left;white-space:pre-wrap;">${escapeHtml((d.afterSchoolActivityTags || []).join("、"))}<br>${escapeHtml(d.afterSchoolSupport || "--")}</td>
                            <td style="text-align:left;white-space:pre-wrap;">${escapeHtml(d.afterSchoolEpisode || "")}<br>${escapeHtml(d.afterSchoolHandover || "--")}</td>
                        </tr>`;
                    });
                    html += `</table>`;
                } else if (sType === "生活介護") {
                    html += `<table class="history-table">
                        <tr><th>日付</th><th>利用・時間</th><th>送迎</th><th>健康</th><th>生活支援</th><th>日中活動・個別支援</th><th>職員・本人の様子</th></tr>`;
                    userRecords.forEach(d => {
                        const pickup = [d.lifeCarePickupType, d.lifeCarePickupNote].filter(Boolean).map(escapeHtml).join(" ") || "--";
                        const dropoff = [d.lifeCareDropoffType, d.lifeCareDropoffNote].filter(Boolean).map(escapeHtml).join(" ") || "--";
                        const health = `体温 ${escapeHtml(d.lifeCareTemperature || "--")}℃／脈拍 ${escapeHtml(d.lifeCarePulse || "--")}／血圧 ${escapeHtml(d.lifeCareBpHigh || "--")}/${escapeHtml(d.lifeCareBpLow || "--")}／SpO2 ${escapeHtml(d.lifeCareSpo2 || "--")}%<br>${escapeHtml(d.lifeCareHealthNote || "")}`;
                        const dailySupport = `食事 ${escapeHtml(d.lifeCareMeal || "--")}／水分 ${escapeHtml(d.lifeCareWater || "--")}<br>服薬 ${escapeHtml(d.lifeCareMedication || "--")}／排泄 ${escapeHtml(d.lifeCareToileting || "--")}／入浴 ${escapeHtml(d.lifeCareBathing || "--")}`;
                        html += `<tr>
                            <td>${escapeHtml(d.date.substring(5).replace('-', '/'))}</td>
                            <td>${escapeHtml(d.lifeCareAttendance || "--")}<br>${escapeHtml(d.lifeCareStartTime || "--")}〜${escapeHtml(d.lifeCareEndTime || "--")}</td>
                            <td>来所 ${escapeHtml(d.lifeCareArrivalTime || "--")} ${pickup}<br>退所 ${escapeHtml(d.lifeCareDepartureTime || "--")} ${dropoff}</td>
                            <td>${health}</td>
                            <td>${dailySupport}</td>
                            <td>${escapeHtml((d.lifeCareActivityTags || []).join("、") || "--")}<br>${escapeHtml(d.lifeCareGoalProgress || "")}<br>${escapeHtml(d.lifeCareActivityDetails || "")}</td>
                            <td>${escapeHtml(d.lifeCareStaff || d.careStaff || "--")}<br>${escapeHtml(d.lifeCareEpisode || "--")}<br>${escapeHtml(d.lifeCareHandover || "")}</td>
                        </tr>`;
                    });
                    html += `</table>`;
                } else {
                    html += `<table class="history-table">
                        <tr>
                            <th width="12%">日付</th><th width="10%">体温</th><th width="10%">脈拍</th>
                            <th width="13%">血圧</th><th width="25%">食事(朝/昼/夕)</th><th width="10%">入浴</th><th width="10%">排泄</th><th width="20%">担当・介護日誌</th>
                        </tr>`;
                    
                    userRecords.forEach(d => {
                        let t = d.stTempIn || d.stTemp1 || d.temp1 || '--';
                        let p = d.stPulseIn || d.stPulse || d.pulse || '--';
                        let bp = (d.stBpHighIn || d.stBpHigh || d.bpHigh || '--') + '/' + (d.stBpLowIn || d.stBpLow || d.bpLow || '--');
                        let meal = (d.stMealBreakfast || '--') + '/' + (d.stMealLunch || d.mealMain || '--') + '/' + (d.stMealDinner || '--');
                        let bath = d.stBath || d.bath || '--';
                        
                        let bStr = "--";
                        if (d.bowel === "なし") bStr = "なし";
                        else if (d.bowel === "あり") bStr = `あり (${d.bowelCount || ""}/${d.bowelCondition || ""})`;
                        
                        html += `<tr>
                            <td>${d.date.substring(5).replace('-','/')}</td>
                            <td>${t}℃</td><td>${p}</td><td>${bp}</td><td>${meal}</td><td>${bath}</td><td>${bStr}</td>
                            <td style="text-align: left; white-space: pre-wrap;">${escapeHtml(d.careStaff || '--')}<br>${escapeHtml(d.careJournal || '記録なし')}</td>
                        </tr>`;
                    });
                    html += `</table>`;
                }
                
                card.innerHTML = html;
                resultArea.appendChild(card);
            });
        };

        window.showStaffResults = function() {
            let staffName = document.getElementById("selectCareStaff").value;
            let records = window.matchedRecordsGlobal
                .filter(record => (record.careStaff || "未入力") === staffName)
                .sort((a, b) => a.date.localeCompare(b.date) || a.userName.localeCompare(b.userName));
            let resultArea = document.getElementById("resultArea");
            currentHistoryView = "staff";
            document.getElementById("printUserResultsBtn").style.display = "none";
            document.getElementById("printStaffResultsBtn").style.display = "block";

            if (records.length === 0) {
                resultArea.innerHTML = `<div class="empty-msg">${escapeHtml(staffName)} の介護日誌はありません。</div>`;
                return;
            }

            let html = `<div class="user-card"><h3>👤 担当：${escapeHtml(staffName)}（${records.length}件）</h3>`;
            html += `<table class="history-table">
                <tr><th width="15%">利用日</th><th width="20%">利用者</th><th>介護日誌</th></tr>`;
            records.forEach(record => {
                html += `<tr>
                    <td>${escapeHtml(record.date || '--')}</td>
                    <td>${escapeHtml(record.userName || '--')} 様</td>
                    <td style="text-align: left; white-space: pre-wrap;">${escapeHtml(record.careJournal || '記録なし')}</td>
                </tr>`;
            });
            html += `</table></div>`;
            resultArea.innerHTML = html;
        };

        window.showAuditResults = function() {
            let records = [...window.matchedRecordsGlobal].sort((a, b) => a.date.localeCompare(b.date) || a.userName.localeCompare(b.userName));
            let resultArea = document.getElementById("resultArea");
            if (records.length === 0) {
                alert("表示する記録がありません。");
                return;
            }

            currentHistoryView = "audit";
            document.getElementById("printUserResultsBtn").style.display = "none";
            document.getElementById("printStaffResultsBtn").style.display = "none";
            document.getElementById("auditSelectBox").style.display = "block";

            let targetMonth = document.getElementById("targetMonth").value;
            let serviceType = document.getElementById("selectServiceType").value;
            let html = `<div class="user-card"><h3>📚 月別監査保存用一覧：${escapeHtml(targetMonth)}／${escapeHtml(serviceType)}</h3>`;
            html += `<table class="history-table" style="font-size: 12px;"><tr>
                <th>利用日</th><th>利用者</th><th>担当スタッフ</th><th>重要フラグ</th><th>介護日誌</th><th>申し送り内容</th>
            </tr>`;
            records.forEach(record => {
                let flags = [];
                if (record.handoverRequired) flags.push("要申し送り");
                if (record.medicalVisit) flags.push("受診対応あり");
                if (record.conditionChange) flags.push("体調変化");
                html += `<tr>
                    <td>${escapeHtml(record.date || "--")}</td>
                    <td>${escapeHtml(record.userName || "--")} 様</td>
                    <td>${escapeHtml(record.careStaff || "未入力")}</td>
                    <td style="color: #c92a2a; font-weight: bold;">${escapeHtml(flags.join("・") || "-")}</td>
                    <td style="text-align: left; white-space: pre-wrap;">${escapeHtml(record.careJournal || "記録なし")}</td>
                    <td style="text-align: left; white-space: pre-wrap;">${escapeHtml(record.handoverNote || "-")}</td>
                </tr>`;
            });
            html += `</table></div>`;
            resultArea.innerHTML = html;
        };

        function printHistoryResults(expectedView, title) {
            if (currentHistoryView !== expectedView || !document.getElementById("resultArea").innerHTML.trim()) {
                alert("先に表示ボタンを押して一覧を表示してください。");
                return;
            }

            let printWindow = window.open("", "_blank");
            if (!printWindow) {
                alert("印刷画面を開けませんでした。ポップアップを許可してください。");
                return;
            }

            printWindow.document.write(`<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><title>${title}</title><style>
                body { font-family: sans-serif; color: #333; margin: 20px; }
                h1 { font-size: 22px; border-bottom: 2px solid #333; padding-bottom: 8px; }
                h3 { margin: 18px 0 8px; }
                table { width: 100%; border-collapse: collapse; font-size: 12px; }
                th, td { border: 1px solid #333; padding: 6px; text-align: center; }
                th { background: #f0f0f0; }
                @media print { @page { size: landscape; margin: 10mm; } }
            </style></head><body><h1>${title}</h1>${document.getElementById("resultArea").innerHTML}</body></html>`);
            printWindow.document.close();
            printWindow.focus();
            printWindow.onload = () => printWindow.print();
        }

        window.printUserResults = function() {
            printHistoryResults("user", "利用者別 過去データ一覧");
        };

        window.printStaffResults = function() {
            printHistoryResults("staff", "担当者別 介護日誌一覧");
        };

        window.printAuditResults = function() {
            printHistoryResults("audit", "月別監査保存用一覧");
        };
    </script>
</body>
</html>
