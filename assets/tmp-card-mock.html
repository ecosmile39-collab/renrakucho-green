        .birthday-card-container-v2 {

        .bg-image-layer-v2 { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; z-index: 1; }
        
        /* 写真を正方形に保ち、周りをフワッとぼかす設定 */
        .dynamic-photo-v2 { 
            position: absolute; 
            object-fit: cover; 
            z-index: 2; 
            aspect-ratio: 1 / 1; 
            border-radius: 10px; 
            -webkit-mask-image: radial-gradient(circle closest-side, black 60%, transparent 95%);
            mask-image: radial-gradient(circle closest-side, black 60%, transparent 95%);
        }

        .dynamic-text-area-v2 { position: absolute; z-index: 3; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; text-align: center; }
        
        .dynamic-name-v2 { font-weight: 900; color: #111; letter-spacing: 2px; white-space: nowrap; text-shadow: 3px 3px 0 #fff, -3px -3px 0 #fff, 3px -3px 0 #fff, -3px 3px 0 #fff, 0 3px 0 #fff, 0 -3px 0 #fff, 3px 0 0 #fff, -3px 0 0 #fff, 0 0 10px #fff, 0 0 10px #fff, 0 0 10px #fff; }
        .dynamic-date-v2 { font-weight: 900; color: #111; letter-spacing: 2px; white-space: nowrap; text-shadow: 3px 3px 0 #fff, -3px -3px 0 #fff, 3px -3px 0 #fff, -3px 3px 0 #fff, 0 3px 0 #fff, 0 -3px 0 #fff, 3px 0 0 #fff, -3px 0 0 #fff, 0 0 10px #fff, 0 0 10px #fff, 0 0 10px #fff; }
        .dynamic-age-v2 { font-weight: 900; color: #b91c1c; line-height: 1.4; text-align: center; white-space: nowrap; text-shadow: 3px 3px 0 #fff, -3px -3px 0 #fff, 3px -3px 0 #fff, -3px 3px 0 #fff, 0 3px 0 #fff, 0 -3px 0 #fff, 3px 0 0 #fff, -3px 0 0 #fff, 0 0 10px #fff, 0 0 10px #fff, 0 0 10px #fff; }
        .dynamic-staff-msg-v2 { font-weight: 900; color: #111; letter-spacing: 1px; text-align: center; line-height: 1.3; width: 95%; word-break: break-word; text-shadow: 3px 3px 0 #fff, -3px -3px 0 #fff, 3px -3px 0 #fff, -3px 3px 0 #fff, 0 3px 0 #fff, 0 -3px 0 #fff, 3px 0 0 #fff, -3px 0 0 #fff, 0 0 10px #fff, 0 0 10px #fff, 0 0 10px #fff; }

            position: absolute;

            text-align: center;
            font-weight: 900;
            z-index: 4;
            letter-spacing: 0.3em;
            color: #d4af37; /* 美しいゴールド色 */

        .card-longevity .dynamic-chouju-v2 {
            display: block;

        .card-longevity.layout-vertical1 .dynamic-chouju-v2,

            top: 6%;
            font-size: 8cqw;
        }

        .birthday-card-container-v2.layout-vertical2::before {
            content: "";
            position: absolute;
            z-index: 2;
            top: 18%;
            left: 22%;
            width: 56%;
            height: 18%;
            background: radial-gradient(ellipse, #f5e3df 55%, rgba(245, 227, 223, 0.96) 74%, transparent 100%);
            pointer-events: none;
        }

        /* ==========================================
           🎉 各デザイン個別の位置調整
           ========================================== */

        .birthday-card-container-v2.layout-vertical1,
        .birthday-card-container-v2.layout-vertical2 {
            aspect-ratio: 1 / 1.414;
        }

        /* 縦型1（鶴亀と松竹梅） */
        .layout-vertical1 .dynamic-photo-v2 { top: 18%; left: 25%; width: 50%; }
        .layout-vertical1 .dynamic-text-area-v2 { top: 55%; left: 10%; width: 80%; height: 40%; }
        .layout-vertical1 .dynamic-name-v2 { font-size: 5.5cqw; margin-bottom: 1.5cqw; }
        .layout-vertical1 .dynamic-date-v2 { font-size: 4.5cqw; margin-bottom: 1.5cqw; }
        .layout-vertical1 .dynamic-age-v2 { font-size: 6.5cqw; margin-bottom: 1.5cqw; }
        .layout-vertical1 .dynamic-staff-msg-v2 { font-size: 3.5cqw; margin-top: 3cqw; }

        /* 縦型2（ピンクの花柄と巻物） */
        .layout-vertical2 .dynamic-photo-v2 { top: 16%; left: 25%; width: 50%; }
        .layout-vertical2 .dynamic-text-area-v2 { top: 58%; left: 22%; width: 56%; height: 23%; padding-top: 3cqw; box-sizing: border-box; }
        .layout-vertical2 .dynamic-name-v2 { font-size: 4.0cqw; margin-bottom: 1.5cqw; }
        .layout-vertical2 .dynamic-date-v2 { font-size: 3.5cqw; margin-bottom: 1.5cqw; }
        .layout-vertical2 .dynamic-age-v2 { font-size: 5.0cqw; margin-bottom: 1.5cqw; }
        .layout-vertical2 .dynamic-staff-msg-v2 { font-size: 2.8cqw; margin-top: 2cqw; }

        .birthday-card-container-v2.layout-vertical3 { aspect-ratio: 2 / 3; }
        .layout-vertical3 .dynamic-photo-v2 { top: 46%; left: 27%; width: 46%; border-radius: 50%; -webkit-mask-image: radial-gradient(circle closest-side, black 60%, transparent 95%); mask-image: radial-gradient(circle closest-side, black 60%, transparent 95%); }
        .layout-vertical3 .dynamic-text-area-v2 { top: 12%; left: 28%; width: 46%; height: 22%; justify-content: center; }
        .layout-vertical3 .dynamic-name-v2 { font-size: 3.5cqw; margin-bottom: 0.6cqw; }
        .layout-vertical3 .dynamic-date-v2 { font-size: 3.1cqw; margin-bottom: 0.6cqw; }
        .layout-vertical3 .dynamic-age-v2 { font-size: 3.6cqw; margin-bottom: 0.4cqw; }
        .layout-vertical3 .dynamic-staff-msg-v2 { font-size: 2.2cqw; margin-top: 0.6cqw; }

        /* 横型の設定（A4横の比率） */
        .birthday-card-container-v2.layout-horizontal1,
        .birthday-card-container-v2.layout-horizontal2 {
            aspect-ratio: 1.414 / 1; 
        }

        /* 横型1（鶴亀と松竹梅） */
        .layout-horizontal1 .dynamic-photo-v2 { top: 24%; left: 32%; width: 36%; }

        .layout-horizontal1 .dynamic-age-v2 { font-size: 2.8cqw; margin-bottom: 0.5cqw; }
        .layout-horizontal1 .dynamic-staff-msg-v2 { font-size: 1.6cqw; margin-top: 0.5cqw; }

        /* 横型2（ピンクの花柄と巻物） */
        .layout-horizontal2 .dynamic-photo-v2 { top: 21%; left: 31%; width: 38%; }
        .layout-horizontal2.card-two-photos .dynamic-photo-primary-v2 { top: 27%; left: 21%; width: 29%; }
        .layout-horizontal2.card-two-photos .dynamic-photo-secondary-v2 { display: block; top: 27%; left: 50%; width: 29%; }
        .layout-horizontal2 .dynamic-photo-secondary-v2 { display: none; }
        .layout-horizontal2 .dynamic-text-area-v2 { top: 66%; left: 26%; width: 48%; height: 26%; padding-top: 1cqw; box-sizing: border-box; }

        .layout-horizontal2 .dynamic-staff-msg-v2 { font-size: 2cqw; margin-top: 0.5cqw; transform: translateY(0.5cqw); }

        /* 横型3・4（折り紙の花） */
        .birthday-card-container-v2.layout-horizontal3,
        .birthday-card-container-v2.layout-horizontal4 { aspect-ratio: 1.49 / 1; }

        .layout-horizontal4 .dynamic-staff-msg-v2 { font-size: 2.3cqw; margin-top: 0.7cqw; }



        /* ==========================================
           📷 写真を1〜4枚にする（新しいレイアウト・試作）
           写真は「写真の枠（ゾーン）」の中だけに並べ、自動で入る文字とは重ならない
           ========================================== */
        .card-photo-zone { position: absolute; z-index: 2; display: grid; gap: 1.6cqw; }
        .card-photo-zone .card-photo { position: relative; overflow: hidden; border-radius: 1.4cqw; background: #fff; box-shadow: 0 0.6cqw 1.6cqw rgba(0,0,0,0.25); border: 0.8cqw solid #fff; box-sizing: border-box; min-width: 0; min-height: 0; }
        .card-photo-zone .card-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
        /* 1枚：大きく1枚 */
        .card-photo-zone.photos-1 { grid-template: 1fr / 1fr; }
        .card-photo-zone.photos-1 .card-photo { border-radius: 50%; border-width: 1cqw; aspect-ratio: 1 / 1; height: 100%; justify-self: center; }
        /* 横に広い枠：大きい写真を左、小さい写真を右に縦並び */
        .zone-row.photos-2 { grid-template: 1fr / 2fr 1fr; align-items: end; }
        .zone-row.photos-2 .card-photo:nth-child(2) { aspect-ratio: 1 / 1; }
        .zone-row.photos-3 { grid-template: 1fr 1fr / 2fr 1fr; }
        .zone-row.photos-3 .card-photo:first-child { grid-row: 1 / 3; }
        .zone-row.photos-4 { grid-template: 1fr 1fr 1fr / 2.2fr 1fr; }
        .zone-row.photos-4 .card-photo:first-child { grid-row: 1 / 4; }
        /* 縦に長い枠：大きい写真を上、小さい写真を下に横並び */
        .zone-col.photos-2 { grid-template: 1fr / 2fr 1fr; align-items: end; }
        .zone-col.photos-2 .card-photo:nth-child(2) { aspect-ratio: 1 / 1; }
        .zone-col.photos-3 { grid-template: 2fr 1fr / 1fr 1fr; }
        .zone-col.photos-3 .card-photo:first-child { grid-column: 1 / 3; }
        .zone-col.photos-4 { grid-template: 2fr 1fr / 1fr 1fr 1fr; }
        .zone-col.photos-4 .card-photo:first-child { grid-column: 1 / 4; }
        /* 4枚を同じ大きさで */
        .card-photo-zone.photos-4.equal { grid-template: 1fr 1fr / 1fr 1fr; }
        .card-photo-zone.photos-4.equal .card-photo:first-child { grid-row: auto; grid-column: auto; }

        /* デザインごとの「写真の枠」（カード全体に対する位置） */
        .layout-vertical1 .card-photo-zone { top: 15%; left: 18%; width: 64%; height: 38%; }
        .layout-vertical2 .card-photo-zone { top: 15%; left: 17%; width: 66%; height: 41%; }
        .layout-horizontal1 .card-photo-zone { top: 13%; left: 23%; width: 54%; height: 51%; }
        .layout-horizontal2 .card-photo-zone { top: 12%; left: 22%; width: 56%; height: 52%; }
        .layout-horizontal3 .card-photo-zone,
        .layout-horizontal4 .card-photo-zone { top: 53%; left: 40%; width: 56%; height: 43%; }
