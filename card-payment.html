<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>クレジットカードでのお支払い｜えこすまいる連絡帳</title>
    <style>
        body { margin: 0; background: #f4f9f4; font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif; color: #222; line-height: 1.8; }
        main { max-width: 560px; margin: 40px auto; padding: 24px 20px; background: #fff; border: 1px solid #d3e9d3; border-radius: 12px; }
        h1 { margin: 0 0 4px; font-size: 18px; color: #2b8a3e; }
        h2 { margin: 16px 0 8px; font-size: 22px; }
        .note { font-size: 14px; color: #555; }
        .number { font-weight: bold; }
        a.button { display: inline-block; margin-top: 12px; padding: 10px 18px; background: #2b8a3e; color: #fff; border-radius: 6px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
<main>
    <h1>えこすまいる連絡帳</h1>
    <h2 id="title">クレジットカードでのお支払い</h2>
    <p id="message"></p>
    <p class="note">ご不明な点は、株式会社えこすまいる（070-5524-5688、平日10:00〜17:00／ecosmile39@gmail.com）までお問い合わせください。</p>
    <a class="button" href="login.html">連絡帳を開く</a>
</main>
<script>
    (function() {
        const params = new URLSearchParams(location.search);
        const invoice = (params.get("invoice") || "").slice(0, 80);
        const invoiceText = invoice ? "（請求書番号 " + invoice + "）" : "";
        const title = document.getElementById("title");
        const message = document.getElementById("message");
        if (params.get("result") === "success") {
            title.textContent = "お支払いが完了しました";
            message.textContent = "クレジットカードでのお支払いを受け付けました" + invoiceText + "。ありがとうございました。入金は自動で確認されます。領収書は、ご入力いただいたメールアドレスに Stripe から届きます。";
        } else if (params.get("result") === "cancel") {
            title.textContent = "お支払いは完了していません";
            message.textContent = "お支払いを中止しました" + invoiceText + "。請求書メールの「クレジットカードで支払う」ボタンから、もう一度お支払いいただけます。銀行振込でのお支払いもできます。";
        } else {
            message.textContent = "請求書メールの「クレジットカードで支払う」ボタンからお支払いください。";
        }
    })();
</script>
</body>
</html>
