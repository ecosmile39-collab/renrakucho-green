<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>施設の退会・データ削除</title>
    <style>
        body { font-family: sans-serif; background: #f1f3f5; margin: 0; padding: 20px; color: #222; }
        .panel { max-width: 560px; margin: 20px auto; padding: 26px; background: #fff; border: 1px solid #dee2e6; border-radius: 8px; box-shadow: 0 3px 12px rgba(0,0,0,.08); box-sizing: border-box; }
        h1 { color: #c92a2a; font-size: 24px; margin: 0 0 12px; border-bottom: 2px solid #fa5252; padding-bottom: 10px; }
        .warning { padding: 12px; background: #fff5f5; border-left: 4px solid #c92a2a; line-height: 1.6; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #adb5bd; border-radius: 5px; margin-top: 6px; font-size: 16px; }
        button { width: 100%; border: 0; border-radius: 5px; padding: 13px; margin-top: 16px; color: #fff; background: #c92a2a; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:disabled { opacity: .6; cursor: wait; }
        .secondary { background: #6c757d; }
        .error { color: #c92a2a; font-weight: bold; white-space: pre-wrap; }
        .success { color: #237032; font-weight: bold; white-space: pre-wrap; }
        .preview { display: none; margin-top: 16px; padding: 14px; background: #fff9db; border: 1px solid #f08c00; border-radius: 6px; line-height: 1.7; white-space: pre-wrap; }
        a { display: block; text-align: center; margin-top: 20px; color: #4682b4; font-weight: bold; }
    </style>
</head>
<body>
    <main class="panel">
        <h1>施設の退会・データ削除</h1>
        <p class="warning">退会すると、施設アカウント・利用者名簿・連絡帳・介護日誌・写真・動画を削除します。削除したデータは元に戻せません。Storageの保持設定によっては、削除済みファイルが一定期間復元可能な状態で残る場合があります。</p>

        <label for="facilityName">施設名</label>
        <input id="facilityName" type="text" autocomplete="organization" placeholder="施設ログインで使う施設名">
        <label for="facilityPassword">現在の施設ログインパスワード</label>
        <input id="facilityPassword" type="password" autocomplete="current-password">
        <button type="button" id="previewButton" onclick="previewUnsubscribe()">削除対象を確認する</button>
        <div id="preview" class="preview"></div>
        <div id="confirmDeletionArea" style="display: none;">
            <label for="deleteFacilityNameConfirm">最終確認：施設名を入力</label>
            <input id="deleteFacilityNameConfirm" type="text" autocomplete="off" placeholder="登録施設名をそのまま入力">
        </div>
        <button type="button" id="deleteButton" style="display: none;" onclick="deleteFacilityData()">施設名を入力して退会・削除を確定</button>
        <p id="statusMessage" class="error"></p>
        <a href="login.html">ログイン画面へ戻る</a>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-functions.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCLExSyJnb5zvjMbGXv7EsCGFYQf9WZeYg",
            authDomain: "renrakucho-app-6b157.firebaseapp.com",
            projectId: "renrakucho-app-6b157",
            storageBucket: "renrakucho-app-6b157.firebasestorage.app",
            messagingSenderId: "63418706991",
            appId: "1:63418706991:web:43085ce485d2a3d6302ada"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const functions = getFunctions(app);
        let verifiedFacilityId = null;
        let verifiedFacilityName = null;
        let verifiedPassword = null;

        function setStatus(text, type = "error") {
            let status = document.getElementById("statusMessage");
            status.className = type;
            status.textContent = text;
        }

        window.previewUnsubscribe = async function() {
            let facilityName = document.getElementById("facilityName").value.trim();
            let password = document.getElementById("facilityPassword").value;
            let button = document.getElementById("previewButton");
            setStatus("");
            document.getElementById("deleteButton").style.display = "none";
            document.getElementById("confirmDeletionArea").style.display = "none";
            if (!facilityName || !password) {
                setStatus("施設名と現在のパスワードを入力してください。");
                return;
            }

            button.disabled = true;
            button.textContent = "削除対象を確認しています...";
            try {
                const createSession = httpsCallable(functions, "createFacilityDeletionSession");
                const session = await createSession({ facilityName, password });
                await signInWithCustomToken(auth, session.data.customToken);
                const previewDeletion = httpsCallable(functions, "previewFacilityDeletion");
                const result = await previewDeletion({ password });
                const previewData = result.data;
                verifiedFacilityId = previewData.facilityId;
                verifiedFacilityName = previewData.facilityName;
                verifiedPassword = password;
                document.getElementById("preview").textContent = `退会対象の確認\n\n施設：${verifiedFacilityName}\n利用者名簿：${previewData.users}件\n連絡帳・介護日誌：${previewData.records}件\n請求書履歴：${previewData.invoiceHistory}件\n施設ID付き写真・動画：${previewData.scopedStorageFiles}ファイル\n旧保存先の写真・動画：${previewData.legacyStorageFiles}ファイル\n他施設と共有の可能性がある旧ファイル：${previewData.ambiguousLegacyUsers}名分\n\n旧保存先の孤立ファイルは所属施設を判定できず、対象件数に含まれない場合があります。Soft Delete等が有効な場合、削除後もしばらく復元可能な状態で残ることがあります。\n\n内容を確認し、退会を確定する場合は下に施設名をもう一度入力してください。`;
                document.getElementById("preview").style.display = "block";
                document.getElementById("confirmDeletionArea").style.display = "block";
                document.getElementById("deleteFacilityNameConfirm").value = "";
                if (previewData.ambiguousLegacyUsers > 0) {
                    setStatus("他施設と共有の可能性がある旧ファイルがあるため、退会処理を中止しました。管理者へお問い合わせください。", "error");
                    return;
                }
                document.getElementById("deleteButton").style.display = "block";
                setStatus("削除対象を表示しました。ここではまだ何も削除していません。", "success");
            } catch (error) {
                setStatus(error.message || "削除対象を確認できませんでした。");
            } finally {
                button.disabled = false;
                button.textContent = "削除対象を確認する";
            }
        };

        window.deleteFacilityData = async function() {
            if (!verifiedFacilityId) return;
            if (document.getElementById("deleteFacilityNameConfirm").value.trim() !== verifiedFacilityName) {
                setStatus("施設名が一致しません。登録施設名をそのまま入力してください。", "error");
                return;
            }
            if (document.getElementById("facilityPassword").value !== verifiedPassword) {
                setStatus("確認後にパスワードが変更されました。もう一度削除対象を確認してください。", "error");
                return;
            }
            if (!confirm(`最終確認：${verifiedFacilityName} のアカウントとすべてのデータを削除します。元に戻せません。実行しますか？`)) return;

            let button = document.getElementById("deleteButton");
            button.disabled = true;
            setStatus("Storageファイルと施設データを削除しています。画面を閉じないでください。", "success");
            try {
                const deleteFacility = httpsCallable(functions, "deleteFacilityAccount");
                const result = await deleteFacility({
                    password: verifiedPassword,
                    confirmedFacilityName: verifiedFacilityName
                });

                if (localStorage.getItem("currentFacilityId") === verifiedFacilityId) {
                    localStorage.removeItem("currentFacilityId");
                    localStorage.removeItem("currentFacilityName");
                    localStorage.removeItem("isStaffAuthenticated");
                }
                await signOut(auth);
                setStatus("退会処理が完了しました。StorageのSoft Delete設定によっては完全消去まで時間がかかります。", "success");
                document.getElementById("deleteButton").style.display = "none";
                document.getElementById("facilityPassword").value = "";
                verifiedFacilityId = null;
            } catch (error) {
                setStatus("退会処理を完了できませんでした: " + (error.message || "不明なエラー"), "error");
            } finally {
                button.disabled = false;
            }
        };
    </script>
</body>
</html>
