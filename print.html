<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>連絡帳 印刷画面</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #f0f8ff; padding: 20px; margin: 0; color: #333; }
        
        .no-print { background-color: white; padding: 20px; border-radius: 10px; max-width: 800px; margin: 0 auto 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #2b8a3e; margin-top: 0; }
        
        .nav-links { text-align: right; margin-bottom: 15px; }
        .nav-links a { color: #2b8a3e; font-weight: bold; text-decoration: none; margin-left: 15px; }
        .nav-links a:hover { text-decoration: underline; }

        .btn { padding: 10px 20px; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; }
        
        .filter-panel { background-color: #ebfbee; padding: 20px; border-radius: 8px; border: 2px solid #40c057; margin-bottom: 20px; }
        .filter-row { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; margin-bottom: 12px; }
        .filter-row:last-child { margin-bottom: 0; }
        .filter-label { font-weight: bold; font-size: 16px; min-width: 140px; color: #2b8a3e; }
        .filter-select { font-size: 16px; padding: 8px 12px; border-radius: 5px; border: 1px solid #40c057; font-weight: bold; }
        .date-input { font-size: 16px; padding: 8px; border-radius: 5px; border: 1px solid #ccc; }

        .user-select-box { background-color: #fff; padding: 20px; border-radius: 8px; border: 1px solid #ccc; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .user-checkbox-wrapper { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 15px; margin-bottom: 20px; }
        @media (max-width: 800px) { .user-checkbox-wrapper { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 500px) { .user-checkbox-wrapper { grid-template-columns: 1fr; } }
        
        .user-row { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 8px; background-color: #f9f9f9; padding: 12px 15px; border: 1px solid #eee; border-radius: 5px; width: 100%; box-sizing: border-box; }
        .user-row:hover { background-color: #e6f2ff; border-color: #2b8a3e; }
        .user-checkbox-label { cursor: pointer; font-size: 16px; margin: 0; display: flex; align-items: center; gap: 6px; font-weight: bold; }
        .card-checkbox-label { cursor: pointer; font-size: 14px; color: #d6336c; font-weight: bold; margin: 0 0 0 5px; border-left: 3px solid #ccc; padding-left: 10px; display: flex; align-items: center; gap: 6px; }
        .card-msg-input { width: 90%; margin-left: 15px; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; box-sizing: border-box; }

        .btn-batch-print { background-color: #2b8a3e; font-size: 18px; padding: 12px 24px; width: 100%; margin-bottom: 10px; }
        .btn-batch-print:hover { background-color: #237032; }
        .btn-batch-exec { background-color: #e65100; font-size: 18px; padding: 12px 24px; width: 100%; display: none; }
        .btn-batch-exec:hover { background-color: #bf360c; }

        .scroll-btn-group { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 1000; }
        .scroll-btn { background-color: #2b8a3e; color: white; border: none; border-radius: 50%; width: 50px; height: 50px; font-size: 24px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); display: flex; justify-content: center; align-items: center; opacity: 0.8; }

        #printArea { width: 210mm; margin: 0 auto; }

        .print-page { 
            background-color: white; 
            padding: 10mm 15mm 10mm 20mm; 
            box-sizing: border-box; 
            margin-bottom: 30px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); 
            position: relative; 
            min-height: 297mm; 
            width: 100%;
        }
        
        .punch-mark {
            position: absolute;
            top: 50%;
            left: 2mm;
            transform: translateY(-50%); 
            color: #b0c4de; 
            font-size: 24px;
            user-select: none; 
        }

        .print-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-end; 
            margin-bottom: 12px; 
            border-bottom: 2px solid #333; 
            padding-bottom: 6px; 
        }
        .print-header h1 { margin: 0; font-size: 24px; letter-spacing: 1px; text-align: right; }
        .facility-name { font-size: 16px; font-weight: bold; color: #2b8a3e; }
        .print-date { text-align: right; font-size: 14px; margin-bottom: 10px; margin-top: 5px; font-weight: bold; color: #2b8a3e; }
        
        .birthday-banner { background-color: #fff0f5; color: #d2691e; text-align: center; font-size: 15px; font-weight: bold; padding: 6px 10px; margin: 0 0 10px 0; border: 2px dashed #ffb6c1; border-radius: 6px; }
        
        table.compact-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; font-size: 14px; }
        table.compact-table th, table.compact-table td { border: 1px solid #333; padding: 8px; text-align: center; }
        table.compact-table th { background-color: #f9f9f9; font-weight: normal; }
        table.compact-table td { font-weight: bold; }

        table.belongings-print-table { width: 100%; border-collapse: collapse; margin-bottom: 12px; font-size: 12px; }
        table.belongings-print-table th, table.belongings-print-table td { border: 1px solid #333; padding: 4px; text-align: center; }
        table.belongings-print-table th { background-color: #f0f0f0; }
        table.belongings-print-table td.item-name { text-align: left; padding-left: 6px; font-weight: normal; }

        .compact-avg { text-align: center; font-size: 14px; color: #333; margin: 10px 0; font-weight: bold; background-color: #fffacd; border: 1px solid #daa520; padding: 8px; border-radius: 5px; }
        
        .chart-container { height: 160px; width: 100%; position: relative; display: block; margin-bottom: 15px; }
        .section-title { font-weight: bold; font-size: 15px; margin-top: 15px; margin-bottom: 5px; border-bottom: 1px solid #ccc; padding-bottom: 3px; }
        .text-box { border: 1px solid #333; padding: 8px; font-size: 14px; min-height: 40px; white-space: pre-wrap; margin-bottom: 10px; border-radius: 3px; line-height: 1.4; }
        .family-box { min-height: 70px; }
        
        .media-print-area { display: flex; flex-wrap: wrap; gap: 15px; margin-top: 10px; justify-content: flex-start; }
        .media-print-box { text-align: center; }
        .media-print-box img.photo { max-height: 150px; max-width: 200px; object-fit: contain; border: 1px solid #ccc; padding: 2px; }
        .media-print-box img.qr { width: 110px; height: 110px; border: 1px solid #ccc; padding: 2px; margin-bottom: 2px; }
        .media-print-box .media-label { font-size: 12px; font-weight: bold; margin-bottom: 4px; }

        /* ==========================================
           🎉 誕生日カードの共通スタイル
           ========================================== */
        .birthday-card-container-v2 { width: 100%; height: 277mm; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; container-type: inline-size; }
        .bg-image-layer-v2 { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        .dynamic-photo-v2 { position: absolute; object-fit: cover; z-index: 2; border-radius: 3px; }
        
        /* ★ 額縁画像用のスタイルを追加（巨大化防止のため、height:auto; と aspect-ratio:1/1; を強制します） ★ */
        .frame-image { position: absolute; z-index: 2; box-shadow: 5px 5px 15px rgba(0,0,0,0.4); object-fit: fill; height: auto !important; }
        .dynamic-photo-v2.with-frame { z-index: 3; height: auto !important; }

        .dynamic-text-area-v2 { position: absolute; z-index: 3; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        
        .dynamic-name-v2 { font-weight: 900; color: #111; letter-spacing: 2px; white-space: nowrap; text-shadow: 3px 3px 0 #fff, -3px -3px 0 #fff, 3px -3px 0 #fff, -3px 3px 0 #fff, 0 3px 0 #fff, 0 -3px 0 #fff, 3px 0 0 #fff, -3px 0 0 #fff, 0 0 10px #fff, 0 0 10px #fff, 0 0 10px #fff; }
        .dynamic-date-v2 { font-weight: 900; color: #111; letter-spacing: 2px; white-space: nowrap; text-shadow: 3px 3px 0 #fff, -3px -3px 0 #fff, 3px -3px 0 #fff, -3px 3px 0 #fff, 0 3px 0 #fff, 0 -3px 0 #fff, 3px 0 0 #fff, -3px 0 0 #fff, 0 0 10px #fff, 0 0 10px #fff, 0 0 10px #fff; }
        .dynamic-age-v2 { font-weight: 900; color: #b91c1c; line-height: 1.4; text-align: center; white-space: nowrap; text-shadow: 3px 3px 0 #fff, -3px -3px 0 #fff, 3px -3px 0 #fff, -3px 3px 0 #fff, 0 3px 0 #fff, 0 -3px 0 #fff, 3px 0 0 #fff, -3px 0 0 #fff, 0 0 10px #fff, 0 0 10px #fff, 0 0 10px #fff; }
        .dynamic-staff-msg-v2 { font-weight: 900; color: #111; letter-spacing: 1px; text-align: center; line-height: 1.3; width: 90%; word-break: break-word; text-shadow: 3px 3px 0 #fff, -3px -3px 0 #fff, 3px -3px 0 #fff, -3px 3px 0 #fff, 0 3px 0 #fff, 0 -3px 0 #fff, 3px 0 0 #fff, -3px 0 0 #fff, 0 0 10px #fff, 0 0 10px #fff, 0 0 10px #fff; }

        /* ==========================================
           🎉 各デザイン個別の位置調整
           ========================================== */

        /* 縦型の比率維持 */
        .birthday-card-container-v2.layout-vertical1,
        .birthday-card-container-v2.layout-vertical2 {
            aspect-ratio: 1 / 1.414;
        }

        /* 縦型A（標準：bg_birthday.jpg） */
        .layout-vertical1 .dynamic-photo-v2 { top: 21.4%; left: 21.4%; width: 57.2%; height: 27.5%; }
        .layout-vertical1 .dynamic-text-area-v2 { top: 49.5%; left: 0%; width: 100%; height: 26%; }
        .layout-vertical1 .dynamic-name-v2 { font-size: 3.5cqw; margin-bottom: 1.0cqw; }
        .layout-vertical1 .dynamic-date-v2 { font-size: 3.0cqw; margin-bottom: 1.0cqw; }
        .layout-vertical1 .dynamic-age-v2 { font-size: 4.0cqw; }
        .layout-vertical1 .dynamic-staff-msg-v2 { font-size: 2.8cqw; margin-top: 1.5cqw; }

        /* 縦型B（新着：bg_birthday_v2.jpg） */
        .layout-vertical2 .dynamic-photo-v2 { top: 28.5%; left: 27.2%; width: 45.6%; height: 34.0%; }
        .layout-vertical2 .dynamic-text-area-v2 { top: 63.5%; left: 0%; width: 100%; height: 25%; }
        .layout-vertical2 .dynamic-name-v2 { font-size: 3.8cqw; margin-bottom: 1.2cqw; }
        .layout-vertical2 .dynamic-date-v2 { font-size: 3.2cqw; margin-bottom: 1.2cqw; }
        .layout-vertical2 .dynamic-age-v2 { font-size: 4.2cqw; }
        .layout-vertical2 .dynamic-staff-msg-v2 { font-size: 2.8cqw; margin-top: 1.5cqw; }

        /* ★ 横型共通のベース設定 ★ */
        .birthday-card-container-v2.layout-horizontal {
            aspect-ratio: 1.414 / 1; 
        }
        .layout-horizontal .bg-image-layer-v2 { top: 0%; left: 0%; width: 100%; height: 100%; } 
        .layout-horizontal .dynamic-name-v2 { font-size: 2.3cqw; margin-bottom: 0.5cqw; }
        .layout-horizontal .dynamic-date-v2 { font-size: 2.0cqw; margin-bottom: 0.5cqw; }
        .layout-horizontal .dynamic-age-v2 { font-size: 2.7cqw; }
        .layout-horizontal .dynamic-staff-msg-v2 { font-size: 1.8cqw; margin-top: 0.8cqw; }

        /* ==========================================
           🖼️ 新しい横型デザインと「額縁」の位置調整
           ★ 額縁が巨大化しないように aspect-ratio を強制指定しました ★
           ========================================== */

        /* 横型1（bg_birthday_h_1.jpg - ピンク花） */
        .layout-horizontal1 .frame-image { top: 22%; left: 35%; width: 30%; aspect-ratio: 1 / 1; }
        .layout-horizontal1 .dynamic-photo-v2.with-frame { top: 24.1%; left: 36.5%; width: 27%; aspect-ratio: 1 / 1; } 
        .layout-horizontal1 .dynamic-text-area-v2 { top: 67%; left: 20%; width: 60%; height: 20%; }

        /* 横型2（bg_birthday_h_2.jpg - 鶴亀と松） */
        .layout-horizontal2 .frame-image { top: 24%; left: 35%; width: 30%; aspect-ratio: 1 / 1; }
        .layout-horizontal2 .dynamic-photo-v2.with-frame { top: 26.1%; left: 36.5%; width: 27%; aspect-ratio: 1 / 1; } 
        .layout-horizontal2 .dynamic-text-area-v2 { top: 69%; left: 20%; width: 60%; height: 20%; }


        .print-only { display: none; }

        /* ==========================================
           🌟 誕生日カード「のみ」を印刷する場合の特別スタイル
           ========================================== */
        body.mode-card-only #printArea { width: 100%; max-width: 600px; margin: 0 auto; }
        body.mode-card-only .print-page { padding: 0; min-height: auto; box-shadow: none; margin-bottom: 20px; background: transparent; }
        
        body.mode-card-only .birthday-card-container-v2.layout-vertical1,
        body.mode-card-only .birthday-card-container-v2.layout-vertical2 {
            height: auto; aspect-ratio: 1 / 1.414; width: 100%; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        body.mode-card-only .birthday-card-container-v2.layout-horizontal {
            height: auto; aspect-ratio: 1.414 / 1; width: 100%; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* ==========================================
           🖨️ 印刷時専用のスタイル
           ========================================== */
        @media print {
            @page { margin: 0; } 
            
            body { background-color: white; padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .no-print { display: none !important; }
            
            body:not(.mode-card-only) #printArea { max-width: 100% !important; margin: 0 !important; width: 210mm !important; }
            body:not(.mode-card-only) .print-page { 
                padding: 5mm 12mm 4mm 15mm !important; 
                box-shadow: none !important; 
                width: 210mm !important; 
                min-height: 297mm !important; 
                page-break-after: always !important; 
                margin: 0 !important; 
                position: relative !important; 
                box-sizing: border-box !important;
            }
            body:not(.mode-card-only) .birthday-card-container-v2.layout-vertical1,
            body:not(.mode-card-only) .birthday-card-container-v2.layout-vertical2 { 
                height: 297mm !important; box-shadow: none !important; 
            }
            
            /* ★ 通常モードで印刷するときは横型が大きすぎないように制限 ★ */
            body:not(.mode-card-only) .birthday-card-container-v2.layout-horizontal { 
                height: auto !important; 
                aspect-ratio: 1.414 / 1 !important; 
                margin-top: 15mm !important; 
                box-shadow: none !important; 
            }

            /* ★ カードのみ印刷時の設定 ★ */
            body.mode-card-only #printArea { width: 100% !important; max-width: 100% !important; }
            body.mode-card-only .print-page { 
                padding: 0 !important; margin: 0 !important; width: 100% !important; height: 100vh !important; page-break-after: always !important; 
            }
            body.mode-card-only .birthday-card-container-v2 {
                width: 100% !important; height: auto !important; box-shadow: none !important; margin: 0 auto !important;
            }

            .print-only { display: block !important; }
            .page-break { page-break-before: always !important; padding: 0 !important; }
            .punch-mark { position: fixed !important; top: 148.5mm !important; transform: translateY(-50%) !important; left: 4mm !important; color: #aaa !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .text-box, .family-box, table, tr, .section-title, .media-print-area, .chart-container, .birthday-card-container-v2 { page-break-inside: avoid !important; break-inside: avoid !important; }
            
            .print-header { margin-bottom: 2mm !important; padding-bottom: 1mm !important; border-bottom: 2px solid #333 !important; }
            .print-header h1 { font-size: 18px !important; margin: 0 !important; }
            .facility-name { font-size: 14px !important; font-weight: bold !important; }
            .print-date { margin-bottom: 2mm !important; font-size: 11px !important; font-weight: bold !important; }
            h2 { font-size: 16px !important; margin: 0 !important; }
            
            table.compact-table { margin-bottom: 4mm !important; font-size: 12px !important; }
            table.compact-table th, table.compact-table td { padding: 4px !important; border: 1px solid #333 !important; }
            
            table.belongings-print-table { margin-bottom: 4mm !important; font-size: 10px !important; }
            table.belongings-print-table th, table.belongings-print-table td { padding: 2px !important; border: 1px solid #333 !important; }
            
            .st-chart { display: none !important; }
            .admission-vitals-table { display: none !important; } 
            
            .ds-chart { display: block !important; height: 110px !important; margin-bottom: 3mm !important; }
            .ds-chart canvas { display: none !important; }
            .ds-chart img.chart-print-image { display: block !important; width: 100% !important; height: 110px !important; object-fit: contain !important; }

            .compact-avg { margin: 3mm 0 !important; padding: 2px !important; font-size: 11px !important; font-weight: bold !important; border: 1px solid #daa520 !important; border-radius: 5px !important; background-color: #fffacd !important; }

            .text-box { min-height: 20px !important; margin-bottom: 3mm !important; padding: 4px 5px !important; font-size: 11.5px !important; line-height: 1.2 !important; border: 1px solid #333 !important; border-radius: 3px !important; }
            .family-box { min-height: 40px !important; }

            .section-title { margin-top: 4mm !important; margin-bottom: 1mm !important; font-size: 12.5px !important; font-weight: bold !important; border-bottom: 1px solid #ccc !important; padding-bottom: 2px !important; }
            .birthday-banner { margin-bottom: 3mm !important; padding: 2px !important; font-size: 11.5px !important; }
            
            .media-print-box img.photo { max-height: 110px !important; max-width: 150px !important; }
            .media-print-box img.qr { width: 80px !important; height: 80px !important; }
        }
    </style>
</head>
<body>
    <div class="no-print">
        <h2 style="color: #2b8a3e; margin-top: 0;">🖨️ <span id="displayFacilityName">施設名読込中...</span> 連絡帳（印刷・確認画面）</h2>
        
        <div class="nav-links">
            <a href="index.html">⬅ 入力画面へ戻る</a>
            <a href="history.html">➡ 過去データ一覧へ</a>
        </div>

        <div class="filter-panel">
            <div class="filter-row">
                <span class="filter-label">📌 サービス種別：</span>
                <select id="selectServiceType" class="filter-select" onchange="onServiceTypeChanged()">
                    <option value="デイサービス" selected>☀️ デイサービス（日帰り）</option>
                    <option value="ショートステイ">🌙 ショートステイ（宿泊）</option>
                </select>
            </div>

            <div class="filter-row" id="dayServiceDateRow">
                <span class="filter-label">📅 ご利用日：</span>
                <input type="date" id="singleDate" class="date-input" onchange="onDateChanged()">
            </div>

            <div class="filter-row" id="shortStayDateRow" style="display: none;">
                <span class="filter-label">📅 ご宿泊期間：</span>
                <input type="date" id="startDate" class="date-input" onchange="onDateChanged()">
                <span style="font-weight: bold;">～</span>
                <input type="date" id="endDate" class="date-input" onchange="onDateChanged()">
            </div>
            
            <div class="filter-row" style="margin-top: 15px; border-top: 1px dashed #40c057; padding-top: 15px;">
                <span class="filter-label">🖨️ 印刷する内容：</span>
                <select id="selectPrintTarget" class="filter-select" onchange="onCardBgChanged()">
                    <option value="both" selected>連絡帳 ＋ 誕生日カード（A4用紙）</option>
                    <option value="report_only">連絡帳のみ（A4用紙）</option>
                    <option value="card_only">誕生日カードのみ（L版やB5など用紙自由）</option>
                </select>
            </div>
            
            <div class="filter-row">
                <span class="filter-label">📇 誕生日カードのデザイン：</span>
                <select id="selectCardOrientation" class="filter-select" onchange="onCardBgChanged()">
                    <option value="vertical" selected>縦型1（デザインA・標準）</option>
                    <option value="vertical2">縦型2（デザインB・新着）</option>
                    <option value="horizontal1">横型1（ピンクの花柄）</option>
                    <option value="horizontal2">横型2（鶴亀と松）</option>
                </select>
            </div>
            
            <div class="filter-row">
                <span class="filter-label">🎨 誕生日カードの文字背景：</span>
                <select id="selectCardBg" class="filter-select" onchange="onCardBgChanged()">
                    <option value="transparent" selected>透明（イラストをそのまま活かす）</option>
                    <option value="white">白色（文字をくっきりと読みやすくする）</option>
                </select>
            </div>
        </div>
        
        <div class="user-select-box" id="userSelectBox" style="display: none;">
            <div id="selectBoxTitle" style="font-weight: bold; color: #2b8a3e; margin-bottom: 15px; font-size: 18px;">
                ☑ 印刷するお客様を選んでください
            </div>
            
            <label style="font-weight: bold; border-bottom: 2px dashed #ccc; padding-bottom: 10px; display: block; cursor: pointer; margin-bottom: 15px;">
                <input type="checkbox" id="checkAll" checked onchange="toggleAllUsers()"> すべて選択／解除
            </label>
            
            <div class="user-checkbox-wrapper" id="userCheckboxes"></div>
            
            <button class="btn btn-batch-print" id="batchPrintBtn" onclick="loadSelectedAndPrint()">
                📄 選んだ人の連絡帳を画面に表示する（確認用）
            </button>
            
            <button class="btn btn-batch-exec" id="batchPrintExecBtn" onclick="window.print()">
                🖨️ 確認OK！表示されている連絡帳をプリンターで一括印刷する
            </button>
        </div>
    </div>

    <div id="printArea"></div>

    <div class="scroll-btn-group no-print" id="scrollGroup">
        <button class="scroll-btn" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">▲</button>
        <button class="scroll-btn" onclick="window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'})">▼</button>
    </div>

    <script type="module">

                return url;

        function getBirthdayData(birthdayStr, targetDateStr, isShortStay = false, startDateStr = null, endDateStr = null) {
            if (!birthdayStr) return null;
            const bParts = birthdayStr.split("-");
            if (bParts.length < 3) return null;
            const bYear = parseInt(bParts[0], 10);
            const bMonth = parseInt(bParts[1], 10);
            const bDay = parseInt(bParts[2], 10);

            if (!isShortStay) {
                const tParts = targetDateStr.split("-");
                const tYear = parseInt(tParts[0], 10);
                const targetDate = new Date(tYear, parseInt(tParts[1], 10) - 1, parseInt(tParts[2], 10));

                for (let y of [tYear, tYear - 1, tYear + 1]) {
                    const bDate = new Date(y, bMonth - 1, bDay);
                    const age = y - bYear;
                    const diffDays = Math.round((targetDate - bDate) / (1000 * 60 * 60 * 24));
                    if (diffDays >= 0 && diffDays <= 3) {
                        return { isToday: (diffDays === 0), month: bMonth, day: bDay, age: age, diffDays: diffDays };
                    }
                }
                return null;
            } else {
                const sParts = startDateStr.split("-");
                const eParts = endDateStr.split("-");
                const sYear = parseInt(sParts[0], 10);
                const sDate = new Date(sYear, parseInt(sParts[1], 10) - 1, parseInt(sParts[2], 10));
                const eDate = new Date(parseInt(eParts[0], 10), parseInt(eParts[1], 10) - 1, parseInt(eParts[2], 10));

                for (let y of [sYear, sYear - 1, sYear + 1]) {
                    const bDate = new Date(y, bMonth - 1, bDay);
                    const age = y - bYear;
                    if (bDate >= sDate && bDate <= eDate) {
                        return { isToday: true, month: bMonth, day: bDay, age: age, diffDays: 0 };
                    }
                    const diffDaysFromEnd = Math.round((eDate - bDate) / (1000 * 60 * 60 * 24));
                    if (diffDaysFromEnd > 0 && diffDaysFromEnd <= 3) {
                        return { isToday: false, month: bMonth, day: bDay, age: age, diffDays: diffDaysFromEnd };
                    }
                }
                return null;
            }
        }

                            <div class="dynamic-name-v2">${data.userName} 様</div>
                            <div class="dynamic-date-v2">${displayDateText}</div>
                            <div class="dynamic-age-v2">祝 ${bData.age}歳のお誕生日<br>おめでとうございます！</div>
                            ${staffMsgHtml}
                        </div>
                    </div>
                `;
                container.appendChild(cardPageDiv);
            }
        }
    </script>
</body>
</html>
