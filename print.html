<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>連絡帳 印刷画面</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #f0f8ff; padding: 20px; margin: 0; color: #333; }
        
        .no-print { background-color: white; padding: 20px; border-radius: 10px; max-width: 800px; margin: 0 auto 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #2b8a3e; margin-top: 0; }
        
        .nav-links { text-align: right; margin-bottom: 15px; }
        .nav-links a { color: #2b8a3e; font-weight: bold; text-decoration: none; margin-left: 15px; }
        .nav-links a:hover { text-decoration: underline; }

        .btn { padding: 10px 20px; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; }
        
        .filter-panel { background-color: #ebfbee; padding: 20px; border-radius: 8px; border: 2px solid #40c057; margin-bottom: 20px; }
        .filter-row { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; margin-bottom: 12px; }
        .filter-row:last-child { margin-bottom: 0; }
        .filter-label { font-weight: bold; font-size: 16px; min-width: 140px; color: #2b8a3e; }
        .filter-select { font-size: 16px; padding: 8px 12px; border-radius: 5px; border: 1px solid #40c057; font-weight: bold; }
        .date-input { font-size: 16px; padding: 8px; border-radius: 5px; border: 1px solid #ccc; }

        .user-select-box { background-color: #fff; padding: 20px; border-radius: 8px; border: 1px solid #ccc; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        
        /* ★ ユーザー選択のレイアウトを少し綺麗にしました ★ */
        .user-checkbox-wrapper { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; margin-bottom: 20px; }
        .user-row { display: flex; align-items: center; gap: 15px; background-color: #f9f9f9; padding: 8px 15px; border: 1px solid #eee; border-radius: 5px; flex-wrap: wrap; }
        .user-row:hover { background-color: #e6f2ff; border-color: #2b8a3e; }
        .user-checkbox-label { cursor: pointer; font-size: 16px; margin: 0; display: flex; align-items: center; gap: 6px; font-weight: bold; }
        .card-checkbox-label { cursor: pointer; font-size: 14px; color: #d6336c; font-weight: bold; margin: 0; border-left: 3px solid #ccc; padding-left: 15px; display: flex; align-items: center; gap: 6px; }

        .btn-batch-print { background-color: #2b8a3e; font-size: 18px; padding: 12px 24px; width: 100%; margin-bottom: 10px; }
        .btn-batch-print:hover { background-color: #237032; }
        .btn-batch-exec { background-color: #e65100; font-size: 18px; padding: 12px 24px; width: 100%; display: none; }
        .btn-batch-exec:hover { background-color: #bf360c; }

        .scroll-btn-group { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 1000; }
        .scroll-btn { background-color: #2b8a3e; color: white; border: none; border-radius: 50%; width: 50px; height: 50px; font-size: 24px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); display: flex; justify-content: center; align-items: center; opacity: 0.8; }

        #printArea { width: 210mm; margin: 0 auto; }

        .print-page { 
            background-color: white; 
            padding: 10mm 10mm 10mm 20mm; 
            box-sizing: border-box; 
            margin-bottom: 30px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); 
            position: relative; 
            min-height: 297mm; 
            width: 100%;
        }
        
        .punch-mark {
            position: absolute;
            top: 50%;
            left: 2mm;
            transform: translateY(-50%); 
            color: #b0c4de; 
            font-size: 24px;
            user-select: none; 
        }

        .print-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-end; 
            margin-bottom: 12px; 
            border-bottom: 2px solid #333; 
            padding-bottom: 6px; 
        }
        .print-header h1 { margin: 0; font-size: 22px; letter-spacing: 1px; text-align: right; }
        .facility-name { font-size: 16px; font-weight: bold; color: #2b8a3e; }
        .print-date { text-align: right; font-size: 14px; margin-bottom: 10px; margin-top: 5px; font-weight: bold; color: #2b8a3e; }
        
        .birthday-banner { background-color: #fff0f5; color: #d2691e; text-align: center; font-size: 14px; font-weight: bold; padding: 5px 10px; margin: 0 0 8px 0; border: 2px dashed #ffb6c1; border-radius: 6px; }
        
        table.compact-table { width: 100%; border-collapse: collapse; margin-bottom: 12px; font-size: 13px; }
        table.compact-table th, table.compact-table td { border: 1px solid #333; padding: 6px; text-align: center; }
        table.compact-table th { background-color: #f9f9f9; font-weight: normal; }
        table.compact-table td { font-weight: bold; }

        table.belongings-print-table { width: 100%; border-collapse: collapse; margin-bottom: 10px; font-size: 12px; }
        table.belongings-print-table th, table.belongings-print-table td { border: 1px solid #333; padding: 4px; text-align: center; }
        table.belongings-print-table th { background-color: #f0f0f0; }
        table.belongings-print-table td.item-name { text-align: left; padding-left: 6px; font-weight: normal; }

        .compact-avg { text-align: center; font-size: 13px; color: #333; margin: 10px 0; font-weight: bold; background-color: #fffacd; border: 1px solid #daa520; padding: 8px; border-radius: 5px; }
        
        .chart-container { height: 160px; width: 100%; position: relative; display: block; margin-bottom: 10px; }
        .section-title { font-weight: bold; font-size: 14px; margin-top: 12px; margin-bottom: 4px; border-bottom: 1px solid #ccc; padding-bottom: 2px; }
        .text-box { border: 1px solid #333; padding: 8px; font-size: 13px; min-height: 40px; white-space: pre-wrap; margin-bottom: 8px; border-radius: 3px; line-height: 1.4; }
        .family-box { min-height: 70px; }
        
        .media-print-area { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; justify-content: flex-start; }
        .media-print-box { text-align: center; }
        .media-print-box img.photo { max-height: 110px; max-width: 150px; object-fit: contain; border: 1px solid #ccc; padding: 2px; }
        .media-print-box img.qr { width: 90px; height: 90px; border: 1px solid #ccc; padding: 2px; margin-bottom: 2px; }
        .media-print-box .media-label { font-size: 11px; font-weight: bold; margin-bottom: 3px; }

        /* ==========================================
           🎉 誕生日カード専用のスタイル
           ========================================== */
        .birthday-card-container {
            width: 100%;
            height: 277mm; 
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .bg-image-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            z-index: 1;
        }
        .dynamic-photo {
            position: absolute;
            top: 22.5%; 
            left: 22.0%;
            width: 56.0%;
            height: 26.5%;
            object-fit: cover;
            z-index: 2;
            border-radius: 3px;
        }
        .dynamic-text-area {
            position: absolute;
            top: 53.5%; 
            left: 15%; 
            width: 70%; 
            height: 20%; 
            z-index: 3;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease; 
        }
        .dynamic-name { font-size: 24px; font-weight: bold; margin-bottom: 6px; color: #2c2c2c; letter-spacing: 2px; text-shadow: 0 0 4px #fff, 0 0 4px #fff, 0 0 4px #fff; }
        .dynamic-date { font-size: 22px; font-weight: bold; margin-bottom: 6px; color: #2c2c2c; letter-spacing: 2px; text-shadow: 0 0 4px #fff, 0 0 4px #fff, 0 0 4px #fff; }
        .dynamic-age { font-size: 26px; font-weight: bold; color: #b91c1c; line-height: 1.4; text-align: center; text-shadow: 0 0 4px #fff, 0 0 4px #fff, 0 0 4px #fff; }

        .print-only { display: none; }

        @media print {
            @page { size: A4 portrait; margin: 0; } 
            body { background-color: white; padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .no-print { display: none !important; }
            #printArea { max-width: 100% !important; margin: 0 !important; width: 210mm !important; }
            
            .print-only { display: block !important; }

            .print-page { 
                padding: 7mm 12mm 6mm 15mm !important; 
                box-shadow: none !important; 
                width: 210mm !important; 
                min-height: 297mm !important; 
                page-break-after: always !important; 
                margin: 0 !important; 
                position: relative !important; 
                box-sizing: border-box !important;
            }

            .page-break {
                page-break-before: always !important;
                padding: 0 !important; 
            }

            .punch-mark {
                position: fixed !important; 
                top: 148.5mm !important; 
                transform: translateY(-50%) !important;
                left: 4mm !important; 
                color: #aaa !important; 
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            
            .text-box, .family-box, table, tr, .section-title, .media-print-area, .chart-container, .birthday-card-container {
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }
            
            .print-header { margin-bottom: 4px !important; padding-bottom: 2px !important; border-bottom: 2px solid #333 !important; }
            .print-header h1 { font-size: 20px !important; margin: 0 !important; }
            .facility-name { font-size: 15px !important; font-weight: bold !important; }
            .print-date { margin-bottom: 4px !important; font-size: 12px !important; font-weight: bold !important; }
            h2 { font-size: 18px !important; margin: 0 !important; }
            
            table.compact-table { margin-bottom: 6px !important; font-size: 13.5px !important; }
            table.compact-table th, table.compact-table td { padding: 6px !important; border: 1px solid #333 !important; }
            
            table.belongings-print-table { margin-bottom: 6px !important; font-size: 11px !important; }
            table.belongings-print-table th, table.belongings-print-table td { padding: 3px !important; border: 1px solid #333 !important; }
            
            .st-chart { display: none !important; }
            .admission-vitals-table { display: none !important; } 
            
            .ds-chart { display: block !important; height: 120px !important; margin-bottom: 4px !important; }
            .ds-chart canvas { display: none !important; }
            .ds-chart img.chart-print-image { display: block !important; width: 100% !important; height: 120px !important; object-fit: contain !important; }

            .compact-avg { margin: 4px 0 !important; padding: 3px !important; font-size: 11.5px !important; font-weight: bold !important; border: 1px solid #daa520 !important; border-radius: 5px !important; background-color: #fffacd !important; }

            .text-box { min-height: 25px !important; margin-bottom: 4px !important; padding: 5px 6px !important; font-size: 12.5px !important; line-height: 1.3 !important; border: 1px solid #333 !important; border-radius: 3px !important; }
            .family-box { min-height: 50px !important; }

            .section-title { margin-top: 6px !important; margin-bottom: 2px !important; font-size: 13.5px !important; font-weight: bold !important; border-bottom: 1px solid #ccc !important; padding-bottom: 2px !important; }
            .birthday-banner { margin-bottom: 4px !important; padding: 3px !important; font-size: 12.5px !important; }
            
            .media-print-box img.photo { max-height: 125px !important; max-width: 175px !important; }
            .media-print-box img.qr { width: 90px !important; height: 90px !important; }

            .birthday-card-container {
                height: 297mm !important; 
                box-shadow: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="no-print">
        <h2 style="color: #2b8a3e; margin-top: 0;">🖨️ <span id="displayFacilityName">施設名読込中...</span> 連絡帳（印刷・確認画面）</h2>
        
        <div class="nav-links">
            <a href="index.html">⬅ 入力画面へ戻る</a>
            <a href="history.html">➡ 過去データ一覧へ</a>
        </div>

        <div class="filter-panel">
            <div class="filter-row">
                <span class="filter-label">📌 サービス種別：</span>
                <select id="selectServiceType" class="filter-select" onchange="onServiceTypeChanged()">
                    <option value="デイサービス" selected>☀️ デイサービス（日帰り）</option>
                    <option value="ショートステイ">🌙 ショートステイ（宿泊）</option>
                </select>
            </div>

            <div class="filter-row" id="dayServiceDateRow">
                <span class="filter-label">📅 ご利用日：</span>
                <input type="date" id="singleDate" class="date-input" onchange="onDateChanged()">
            </div>

            <div class="filter-row" id="shortStayDateRow" style="display: none;">
                <span class="filter-label">📅 ご宿泊期間：</span>
                <input type="date" id="startDate" class="date-input" onchange="onDateChanged()">
                <span style="font-weight: bold;">～</span>
                <input type="date" id="endDate" class="date-input" onchange="onDateChanged()">
            </div>
            
            <div class="filter-row" style="margin-top: 15px; border-top: 1px dashed #40c057; padding-top: 15px;">
                <span class="filter-label">🎨 誕生日カードの文字背景：</span>
                <select id="selectCardBg" class="filter-select" onchange="onCardBgChanged()">
                    <option value="transparent" selected>透明（イラストをそのまま活かす）</option>
                    <option value="white">白色（文字をくっきりと読みやすくする）</option>
                </select>
            </div>
        </div>
        
        <div class="user-select-box" id="userSelectBox" style="display: none;">
            <div id="selectBoxTitle" style="font-weight: bold; color: #2b8a3e; margin-bottom: 15px; font-size: 18px;">
                ☑ 印刷するお客様を選んでください
            </div>
            
            <label style="font-weight: bold; border-bottom: 2px dashed #ccc; padding-bottom: 10px; display: block; cursor: pointer; margin-bottom: 15px;">
                <input type="checkbox" id="checkAll" checked onchange="toggleAllUsers()"> すべて選択／解除
            </label>
            
            <div class="user-checkbox-wrapper" id="userCheckboxes"></div>
            
            <button class="btn btn-batch-print" id="batchPrintBtn" onclick="loadSelectedAndPrint()">
                📄 選んだ人の連絡帳を画面に表示する（確認用）
            </button>
            
            <button class="btn btn-batch-exec" id="batchPrintExecBtn" onclick="window.print()">
                🖨️ 確認OK！表示されている連絡帳をプリンターで一括印刷する
            </button>
        </div>
    </div>

    <div id="printArea"></div>

    <div class="scroll-btn-group no-print" id="scrollGroup">
        <button class="scroll-btn" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">▲</button>
        <button class="scroll-btn" onclick="window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'})">▼</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getStorage, ref, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCLExSyJnb5zvjMbGXv7EsCGFYQf9WZeYg",
            authDomain: "renrakucho-app-6b157.firebaseapp.com",
            projectId: "renrakucho-app-6b157",
            storageBucket: "renrakucho-app-6b157.firebasestorage.app",
            messagingSenderId: "63418706991",
            appId: "1:63418706991:web:43085ce485d2a3d6302ada"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        let chartInstances = [];
        window.globalUsersData = {};
        window.matchedRecordsGlobal = [];
        const mediaUrlCache = new Map();
        
        const defaultIcon = "data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==";

        window.onload = async function() {
            let facilityId = localStorage.getItem("currentFacilityId");
            if (!facilityId) { window.location.replace("login.html"); return; }
            
            let facilityName = localStorage.getItem("currentFacilityName") || "連絡帳アプリ";
            let nameEl = document.getElementById("displayFacilityName");
            if (nameEl) nameEl.textContent = facilityName;

            let today = new Date();
            let year = today.getFullYear();
            let month = String(today.getMonth() + 1).padStart(2, '0');
            let day = String(today.getDate()).padStart(2, '0');
            let todayStr = `${year}-${month}-${day}`;
            
            document.getElementById("singleDate").value = todayStr;
            document.getElementById("startDate").value = todayStr;
            document.getElementById("endDate").value = todayStr;

            let savedServiceType = localStorage.getItem('currentServiceType');
            if (savedServiceType) {
                document.getElementById("selectServiceType").value = savedServiceType;
            }
            
            await loadUserNames(facilityId);
            onServiceTypeChanged();
        };

        async function loadUserNames(facilityId) {
            try {
                let usersRef = collection(db, "facilities", facilityId, "users");
                let snapshot = await getDocs(usersRef);
                window.globalUsersData = {}; 
                snapshot.forEach((docSnap) => {
                    window.globalUsersData[docSnap.id] = docSnap.data();
                });
            } catch (error) { console.log("名簿エラー:", error); }
        }

        window.onServiceTypeChanged = function() {
            let sType = document.getElementById("selectServiceType").value;
            localStorage.setItem('currentServiceType', sType);

            if (sType === "デイサービス") {
                document.getElementById("dayServiceDateRow").style.display = "flex";
                document.getElementById("shortStayDateRow").style.display = "none";
            } else {
                document.getElementById("dayServiceDateRow").style.display = "none";
                document.getElementById("shortStayDateRow").style.display = "flex";
            }
            onDateChanged();
        };

        window.onDateChanged = async function() {
            let facilityId = localStorage.getItem("currentFacilityId");
            let sType = document.getElementById("selectServiceType").value;
            
            let startDate = (sType === "デイサービス") ? document.getElementById("singleDate").value : document.getElementById("startDate").value;
            let endDate = (sType === "デイサービス") ? document.getElementById("singleDate").value : document.getElementById("endDate").value;

            let selectBox = document.getElementById("userSelectBox");
            let checkboxesArea = document.getElementById("userCheckboxes");
            
            document.getElementById("printArea").innerHTML = "";
            document.getElementById("batchPrintExecBtn").style.display = "none";
            document.getElementById("batchPrintBtn").style.display = "none";
            
            if (!startDate || !endDate || !facilityId) {
                selectBox.style.display = "none";
                return;
            }

            if (startDate > endDate) {
                selectBox.style.display = "block";
                checkboxesArea.innerHTML = `<span style="color: red; font-weight: bold;">エラー：開始日は終了日より前の日付を指定してください。</span>`;
                return;
            }

            selectBox.style.display = "block";
            checkboxesArea.innerHTML = `⏳ 【${sType}】の利用データを検索中...`;

            try {
                let recordsRef = collection(db, "facilities", facilityId, "daily_records");
                let q = query(recordsRef, where("date", ">=", startDate), where("date", "<=", endDate));
                let snapshot = await getDocs(q);

                window.matchedRecordsGlobal = [];
                let uniqueUsers = new Set();

                snapshot.forEach(docSnap => {
                    let data = docSnap.data();
                    let recordService = data.serviceType || "デイサービス";

                    if (recordService === sType) {
                        window.matchedRecordsGlobal.push(data);
                        uniqueUsers.add(data.userName);
                    }
                });

                if (window.matchedRecordsGlobal.length === 0) {
                    let periodText = (startDate === endDate) ? `${startDate}` : `${startDate} ～ ${endDate}`;
                    checkboxesArea.innerHTML = `<span style="color: red; font-weight: bold;">${periodText} の【${sType}】の連絡帳データはありません。</span>`;
                    return;
                }

                checkboxesArea.innerHTML = "";
                document.getElementById("checkAll").checked = true;
                
                // ★ ユーザー一覧を作る時に、誕生日かどうかの判定をしてチェックボックスを作ります ★
                Array.from(uniqueUsers).sort().forEach((userName) => {
                    let uData = window.globalUsersData[userName];
                    // 終了日を基準に、前後7日間を誕生日期間として判定します
                    let bData = getBirthdayData(uData ? uData.birthday : null, endDate, sType === "ショートステイ", startDate, endDate);

                    let div = document.createElement("div");
                    div.className = "user-row";
                    
                    let userLbl = document.createElement("label");
                    userLbl.className = "user-checkbox-label";
                    userLbl.innerHTML = `<input type="checkbox" class="user-chk" value="${userName}" checked> ${userName} 様`;
                    div.appendChild(userLbl);

                    // もし前後7日以内の誕生日なら、「カードも印刷する」チェックボックスを出します
                    if (bData) {
                        let cardLbl = document.createElement("label");
                        cardLbl.className = "card-checkbox-label";
                        // 誕生日より前、または当日なら自動でチェックを入れる。過ぎていたら二重渡し防止でチェックを外す。
                        let isChecked = (bData.diffDays <= 0) ? "checked" : "";
                        cardLbl.innerHTML = `<input type="checkbox" class="card-chk" value="${userName}" ${isChecked}> 🎁 誕生日カードも印刷`;
                        div.appendChild(cardLbl);
                    }
                    
                    checkboxesArea.appendChild(div);
                });

                document.getElementById("batchPrintBtn").style.display = "block";
                document.getElementById("batchPrintBtn").textContent = `📄 【${sType}】の連絡帳を画面に表示する（確認用）`;
                document.getElementById("batchPrintBtn").disabled = false;

            } catch (error) {
                checkboxesArea.innerHTML = "検索エラー: " + error.message;
            }
        };

        window.toggleAllUsers = function() {
            let isChecked = document.getElementById("checkAll").checked;
            document.querySelectorAll(".user-chk").forEach(chk => chk.checked = isChecked);
        };

        window.onCardBgChanged = function() {
            if (document.getElementById("batchPrintBtn").textContent === "🔄 表示を更新する") {
                loadSelectedAndPrint();
            }
        };

        window.loadSelectedAndPrint = async function() {
            let facilityId = localStorage.getItem("currentFacilityId");
            let sType = document.getElementById("selectServiceType").value;
            let startDate = (sType === "デイサービス") ? document.getElementById("singleDate").value : document.getElementById("startDate").value;
            let endDate = (sType === "デイサービス") ? document.getElementById("singleDate").value : document.getElementById("endDate").value;
            
            let facilityName = localStorage.getItem("currentFacilityName") || "連絡帳アプリ";
            
            let btn = document.getElementById("batchPrintBtn");
            let printArea = document.getElementById("printArea");

            let chks = document.querySelectorAll(".user-chk:checked");
            if (chks.length === 0) {
                alert("印刷するお客様を1名以上選んでください。");
                return;
            }
            let selectedUserNames = Array.from(chks).map(chk => chk.value);

            // ★ スタッフが「カードも印刷」にチェックを入れた人の名前を集めます ★
            let cardChks = document.querySelectorAll(".card-chk:checked");
            let printCardUsers = Array.from(cardChks).map(chk => chk.value);

            let targetRecords = window.matchedRecordsGlobal.filter(record => selectedUserNames.includes(record.userName));
            
            let recordsByUser = {};
            targetRecords.forEach(r => {
                if(!recordsByUser[r.userName]) recordsByUser[r.userName] = [];
                recordsByUser[r.userName].push(r);
            });

            btn.disabled = true;
            btn.textContent = `⚡ 【${sType}】の連絡帳を生成中...`;

            try {
                let yearMonth = startDate.substring(0, 7);
                let recordsRef = collection(db, "facilities", facilityId, "daily_records");
                let allMonthQuery = query(recordsRef, where("date", ">=", `${yearMonth}-01`), where("date", "<=", `${yearMonth}-31`));
                let monthSnap = await getDocs(allMonthQuery);
                
                let monthlyDataByUser = {};
                monthSnap.forEach(docSnap => {
                    let d = docSnap.data();
                    if (!monthlyDataByUser[d.userName]) monthlyDataByUser[d.userName] = [];
                    monthlyDataByUser[d.userName].push(d);
                });

                printArea.innerHTML = "";
                document.getElementById("batchPrintExecBtn").style.display = "none";
                
                chartInstances.forEach(c => c.destroy());
                chartInstances = [];

                let chartIndex = 0;
                let sheetPromises = [];

                Object.keys(recordsByUser).forEach(userName => {
                    let userPeriodRecords = recordsByUser[userName];
                    userPeriodRecords.sort((a, b) => a.date.localeCompare(b.date)); 
                    let userMonthRecords = monthlyDataByUser[userName] || userPeriodRecords;

                    if (sType === "ショートステイ") {
                        let shouldPrintCard = printCardUsers.includes(userName);
                        // 1回印刷したら、二重に印刷されないようにリストから消します
                        if(shouldPrintCard) {
                            printCardUsers = printCardUsers.filter(u => u !== userName);
                        }
                        sheetPromises.push(renderGreenShortStayReport(printArea, userName, facilityName, userPeriodRecords, userMonthRecords, chartIndex++, startDate, endDate, shouldPrintCard));
                    } else {
                        userPeriodRecords.forEach(data => {
                            let shouldPrintCard = printCardUsers.includes(data.userName);
                            if(shouldPrintCard) {
                                printCardUsers = printCardUsers.filter(u => u !== data.userName);
                            }
                            sheetPromises.push(renderDayServiceSheet(printArea, data, facilityName, userMonthRecords, chartIndex++, shouldPrintCard));
                        });
                    }
                });

                await Promise.all(sheetPromises);

                btn.disabled = false;
                btn.textContent = "🔄 表示を更新する";
                document.getElementById("batchPrintExecBtn").style.display = "block";

            } catch (error) {
                alert("エラーが発生しました: " + error.message);
                btn.disabled = false;
                btn.textContent = `📄 【${sType}】の連絡帳を画面に表示する（確認用）`;
            }
        };

                return url;
            } catch(e) {

        }

        // ★ お誕生日期間の判定を「前後7日間」に拡張しました ★
        function getBirthdayData(birthdayStr, targetDateStr, isShortStay = false, startDateStr = null, endDateStr = null) {
            if (!birthdayStr) return null;
            const bParts = birthdayStr.split("-");
            if (bParts.length < 3) return null;
            const bYear = parseInt(bParts[0], 10);
            const bMonth = parseInt(bParts[1], 10);
            const bDay = parseInt(bParts[2], 10);

            if (!isShortStay) {
                const tParts = targetDateStr.split("-");
                const tYear = parseInt(tParts[0], 10);
                const targetDate = new Date(tYear, parseInt(tParts[1], 10) - 1, parseInt(tParts[2], 10));

                for (let y of [tYear, tYear - 1, tYear + 1]) {
                    const bDate = new Date(y, bMonth - 1, bDay);
                    const age = y - bYear;
                    const diffDays = Math.round((targetDate - bDate) / (1000 * 60 * 60 * 24));
                    // 7日前(-7) ～ 7日後(7) の間をお誕生日期間とします
                    if (diffDays >= -7 && diffDays <= 7) {
                        return { isToday: (diffDays === 0), month: bMonth, day: bDay, age: age, diffDays: diffDays };
                    }
                }
                return null;
            } else {
                const sParts = startDateStr.split("-");
                const eParts = endDateStr.split("-");
                const sYear = parseInt(sParts[0], 10);
                const sDate = new Date(sYear, parseInt(sParts[1], 10) - 1, parseInt(sParts[2], 10));
                const eDate = new Date(parseInt(eParts[0], 10), parseInt(eParts[1], 10) - 1, parseInt(eParts[2], 10));

                for (let y of [sYear, sYear - 1, sYear + 1]) {
                    const bDate = new Date(y, bMonth - 1, bDay);
                    const age = y - bYear;
                    
                    if (bDate >= sDate && bDate <= eDate) {
                        return { isToday: true, month: bMonth, day: bDay, age: age, diffDays: 0 };
                    }
                    
                    const diffDaysFromStart = Math.round((sDate - bDate) / (1000 * 60 * 60 * 24));
                    const diffDaysFromEnd = Math.round((eDate - bDate) / (1000 * 60 * 60 * 24));
                    
                    if (diffDaysFromEnd > 0 && diffDaysFromEnd <= 7) {
                        return { isToday: false, month: bMonth, day: bDay, age: age, diffDays: diffDaysFromEnd };
                    }
                    if (diffDaysFromStart < 0 && diffDaysFromStart >= -7) {
                        return { isToday: false, month: bMonth, day: bDay, age: age, diffDays: diffDaysFromStart };
                    }
                }
                return null;
            }
        }

                        <th width="12%">日付</th><th width="15%">体温</th><th width="10%">脈拍</th><th width="15%">血圧</th><th width="24%">食事(朝/昼/夕)</th><th width="12%">入浴</th><th width="12%">排泄</th>
                    </tr>
                    ${tableRows}
                </table>

                <div class="compact-avg">
                    📊 ご利用日数の平均値： 体温 ${avgTempStr}℃ ／ 血圧 ${avgBpHighStr}/${avgBpLowStr} ／ 脈拍 ${avgPulseStr}回/分 ／ 酸素飽和度 ${avgSpo2Str}%
                </div>

                <div class="chart-container st-chart">
                    <canvas id="${chartCanvasId}"></canvas>
                    <img id="${chartCanvasId}_print_img" class="chart-print-image" style="display: none; width: 100%; height: 130px; object-fit: contain;">
                </div>

                <div class="section-title">■ ご利用中の活動・夜間のご様子</div>
                <div class="text-box">${dayActivityHtml || '特になし'}</div>

                <div class="section-title">■ お客様への御連絡事項</div>
                ${finalMessageHtml}
                
                <div class="section-title">■ お客様からの御連絡事項 <span style="font-size: 10px; font-weight: normal; margin-left: 10px;">（ご家庭でのご様子など、ご自由にお書きください）</span></div>
                <div class="text-box family-box">${familyMessageText}</div>

                <div class="section-title">■ 施設でのご様子 (写真・動画)</div>
                <div class="media-print-area">${mediaHtml}</div>
            `;

            container.appendChild(pageDiv);
            drawChart(chartCanvasId, labels, temps, bpHighs, bpLows);

            // ★ 2枚目（豪華誕生日カード画像版）の出力
            if (bData && shouldPrintCard) {
                let todayImgUrl = await getCachedUrl(`images/${userName}/image_1.jpg`);
                if (!todayImgUrl) todayImgUrl = await getCachedUrl(`faces/${userName}/face.jpg`) || defaultIcon;

                let currentYear = parseInt(startDate.substring(0,4));
                let reiwaYear = currentYear - 2018;
                let reiwaText = reiwaYear === 1 ? "元" : reiwaYear;
                let displayDateText = `令和${reiwaText}年 ${bData.month}月${bData.day}日`;

                let cardBgChoice = document.getElementById("selectCardBg").value;
                let textAreaStyle = cardBgChoice === "white" 
                    ? "background-color: white; border-radius: 10px; padding: 10px;" 
                    : "background-color: transparent;";

                let cardPageDiv = document.createElement("div");
                cardPageDiv.className = "print-page page-break"; 
                cardPageDiv.innerHTML = `
                    <div class="birthday-card-container">
                        <img src="bg_birthday.jpg" class="bg-image-layer" alt="背景">
                        
                        <img src="${todayImgUrl}" class="dynamic-photo" alt="笑顔の写真">
                        
                        <div class="dynamic-text-area" style="${textAreaStyle}">
                            <div class="dynamic-name">${userName} 様</div>
                            <div class="dynamic-date">${displayDateText}</div>
                            <div class="dynamic-age">祝 ${bData.age}歳のお誕生日<br>おめでとうございます！</div>
                        </div>
                    </div>
                `;
                container.appendChild(cardPageDiv);
            }
        }

        async function renderDayServiceSheet(container, data, facilityName, monthRecords, index, shouldPrintCard) {
            let pageDiv = document.createElement("div");
            pageDiv.className = "print-page";

            let trainAct = "";
            if (data.training) trainAct += "【機能訓練】\n" + data.training + "\n\n";
            if (data.activity) trainAct += "【その他の活動】\n" + data.activity;

            let cloned = [...monthRecords].sort((a, b) => a.date.localeCompare(b.date));
            let sumTemp = 0, sumPulse = 0, sumBpHigh = 0, sumBpLow = 0, sumSpo2 = 0;
            let cTemp = 0, cPulse = 0, cBpHigh = 0, cBpLow = 0, cSpo2 = 0;
            let labels = [], temps = [], bpHighs = [], bpLows = [];

            cloned.forEach(d => {
                labels.push(parseInt(d.date.substring(8, 10), 10) + "日");
                let t = parseFloat(d.temp1); if (!isNaN(t)) { sumTemp += t; cTemp++; temps.push(t); } else { temps.push(null); }
                let p = parseFloat(d.pulse); if (!isNaN(p)) { sumPulse += p; cPulse++; }
                let bh = parseFloat(d.bpHigh); if (!isNaN(bh)) { sumBpHigh += bh; cBpHigh++; bpHighs.push(bh); } else { bpHighs.push(null); }
                let bl = parseFloat(d.bpLow); if (!isNaN(bl)) { sumBpLow += bl; cBpLow++; bpLows.push(bl); } else { bpLows.push(null); }
                let s = parseFloat(d.spo2); if (!isNaN(s)) { sumSpo2 += s; cSpo2++; }
            });

            let avgTempStr = cTemp > 0 ? (sumTemp / cTemp).toFixed(1) : "--";
            let avgPulseStr = cPulse > 0 ? Math.round(sumPulse / cPulse) : "--";
            let avgBpHighStr = cBpHigh > 0 ? Math.round(sumBpHigh / cBpHigh) : "--";
            let avgBpLowStr = cBpLow > 0 ? Math.round(sumBpLow / cBpLow) : "--";
            let avgSpo2Str = cSpo2 > 0 ? Math.round(sumSpo2 / cSpo2) : "--";

            // ★ 1枚目用の小さなバナー
            let uData = window.globalUsersData[data.userName];
            let bData = getBirthdayData(uData ? uData.birthday : null, data.date, false);
            
            let birthdayBannerHtml = "";
            if (bData) {
                if (bData.diffDays < 0) {
                    birthdayBannerHtml = `<div class="birthday-banner">🎂 もうすぐ ${bData.month}月${bData.day}日 ${bData.age}歳のお誕生日ですね！早めのお祝いです 🎂</div>`;
                } else if (bData.diffDays === 0) {
                    birthdayBannerHtml = `<div class="birthday-banner">🎂 本日は ${bData.age}歳のお誕生日です！おめでとうございます！ 🎂</div>`;
                } else {
                    birthdayBannerHtml = `<div class="birthday-banner">🎂 ${bData.month}月${bData.day}日は ${bData.age}歳のお誕生日でしたね。おめでとうございます！ 🎂</div>`;
                }
            }

            let chartCanvasId = `chart_${index}`;

            let mediaPromises = [];
            let iCount = data.imageCount || 0;
            for (let i = 1; i <= iCount; i++) {
                mediaPromises.push((async () => {
                    let url = await getCachedUrl(`images/${data.userName}/image_${i}.jpg`);
                    if (url) return `<div class="media-print-box"><div class="media-label">📷 本日の写真</div><img src="${url}" class="photo"></div>`;
                    return "";
                })());
            }

            let vCount = data.videoCount || 0;
            for (let i = 1; i <= vCount; i++) {
                mediaPromises.push((async () => {
                    let url = await getCachedUrl(`videos/${data.userName}/${data.date}_video_${i}.mp4`);
                    if (url) {
                        let qr = new QRious({ value: url, size: 150 });
                        return `<div class="media-print-box"><div class="media-label">🎥 動画 (QR読取)</div><img src="${qr.toDataURL()}" class="qr"><br></div>`;
                    }
                    return "";
                })());
            }

            let mediaResults = await Promise.all(mediaPromises);
            let mediaHtml = mediaResults.join("");

            let excretionRow = "";
            if (uData && uData.needExcretion) {
                let bStr = "未入力";
                if (data.bowel === "なし" || (!data.bowel && data.dsBowel === "なし")) {
                    bStr = "なし";
                } else if (data.bowel === "あり" || (!data.bowel && data.dsBowel === "あり")) {
                    let details = [];
                    if (data.bowel1) details.push(`1回目:${data.bowel1}`);
                    if (data.bowel2) details.push(`2回目:${data.bowel2}`);
                    if (data.bowel3) details.push(`3回目:${data.bowel3}`);
                    
                    if (details.length === 0 && data.bowelCondition) {
                        details.push(`${data.bowelCount || "回数不明"} ／ ${data.bowelCondition || "状態不明"}`);
                    }

                    if (details.length > 0) {
                        bStr = `あり （${details.join('、')}）`;
                    } else {
                        bStr = "あり";
                    }
                }
                excretionRow = `<tr><th>排泄記録</th><td colspan="7">${bStr}</td></tr>`;
            }

            let bpStrDay = '--';
            if (data.bpHigh || data.bpLow) {
                let h = data.bpHigh ? data.bpHigh : '';
                let l = data.bpLow ? data.bpLow : '';
                bpStrDay = h + '/' + l;
            }

            let mainMessage = data.message ? data.message.replace(/\n/g, '<br>') : '特になし';

            let prPart = "";
            if (data.facilityPR && data.facilityPR.trim() !== "") {
                let prText = data.facilityPR.trim().replace(/\n+/g, '<br>');
                prPart = `
                    <div style="margin-top: 3px; padding-top: 3px; border-top: 1px dashed #999; color: #2b8a3e; font-size: 12px; line-height: 1.25;">
                        <span style="font-weight: bold;">【${facilityName}からのお知らせ】</span> ${prText}
                    </div>
                `;
            }
            
            let finalMessageHtml = `<div class="text-box">${mainMessage}${prPart}</div>`;
            let familyMessageText = data.familyMessage ? data.familyMessage.replace(/\n/g, '<br>') : '';

            pageDiv.innerHTML = `
                <div class="punch-mark">▷</div>
                <div class="print-header">
                    <div class="facility-name">${facilityName}</div>
                    <h1>本日の連絡帳</h1>
                </div>

                ${birthdayBannerHtml}
                
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                    <h2 style="font-size: 19px; margin: 0;">お名前： ${data.userName} 様</h2>
                    <div class="print-date" style="margin: 0;">📓 記録日： ${data.date}</div>
                </div>

                <table class="compact-table">
                    <tr>
                        <th width="16%">体温(来所時)</th><td width="17%">${data.temp1 ? data.temp1 + '℃' : '未入力'}</td>
                        <th width="16%">体温(途中)</th><td width="17%">${data.temp2 ? data.temp2 + '℃' : '未入力'}</td>
                        <th width="16%">血圧</th><td width="18%">${bpStrDay}</td>
                    </tr>
                    <tr>
                        <th>脈拍</th><td>${data.pulse ? data.pulse + '回/分' : '未入力'}</td>
                        <th>酸素飽和度</th><td colspan="3">${data.spo2 ? data.spo2 + '%' : '未入力'}</td>
                    </tr>
                </table>
                <table class="compact-table">
                    <tr>
                        <th width="12%">食事(主食)</th><td width="13%">${data.mealMain || '未入力'}</td>
                        <th width="12%">食事(副食)</th><td width="13%">${data.mealSub || '未入力'}</td>
                        <th width="10%">水分</th><td width="15%">${data.water || '未入力'}</td>
                        <th width="10%">口腔ケア</th><td width="15%">${data.oralCare || '未実施'}</td>
                    </tr>
                    <tr>
                        <th>入浴</th><td colspan="3">${data.bath || '未入力'} <span style="font-size:10px;">${data.bathReason ? '(' + data.bathReason + ')' : ''}</span></td>
                        <th>服薬・処置</th><td colspan="3">${data.medication || 'なし'}</td>
                    </tr>
                    ${excretionRow}
                </table>
                
                <div class="compact-avg">
                    📊 この1ヶ月の平均値： 体温 ${avgTempStr}℃ ／ 血圧 ${avgBpHighStr}/${avgBpLowStr} ／ 脈拍 ${avgPulseStr}回/分 ／ 酸素飽和度 ${avgSpo2Str}%
                </div>
                
                <div class="chart-container ds-chart">
                    <canvas id="${chartCanvasId}"></canvas>
                    <img id="${chartCanvasId}_print_img" class="chart-print-image" style="display: none; width: 100%; height: 120px; object-fit: contain;">
                </div>
                
                <div class="section-title">■ 機能訓練・活動の様子</div>
                <div class="text-box">${trainAct || '特になし'}</div>
                
                <div class="section-title">■ お客様への御連絡事項 <span style="font-size: 13px; font-weight: normal; margin-left: 15px;">本日のご利用ありがとうございました。</span></div>
                ${finalMessageHtml}
                
                <div class="section-title">■ お客様からの御連絡事項 <span style="font-size: 12px; font-weight: normal; margin-left: 10px;">（ご家庭でのご様子など、ご自由にお書きください）</span></div>
                <div class="text-box family-box">${familyMessageText}</div>

                <div class="section-title">■ 本日のご様子 (写真・動画)</div>
                <div class="media-print-area">${mediaHtml}</div>
            `;

            container.appendChild(pageDiv);
            drawChart(chartCanvasId, labels, temps, bpHighs, bpLows);

            // ★ 2枚目（豪華誕生日カード画像版）の出力
            if (bData && shouldPrintCard) {
                let todayImgUrl = await getCachedUrl(`images/${data.userName}/image_1.jpg`);
                if (!todayImgUrl) todayImgUrl = await getCachedUrl(`faces/${data.userName}/face.jpg`) || defaultIcon;

                let currentYear = parseInt(data.date.substring(0,4));
                let reiwaYear = currentYear - 2018;
                let reiwaText = reiwaYear === 1 ? "元" : reiwaYear;
                let displayDateText = `令和${reiwaText}年 ${bData.month}月${bData.day}日`;

                let cardBgChoice = document.getElementById("selectCardBg").value;
                let textAreaStyle = cardBgChoice === "white" 
                    ? "background-color: white; border-radius: 10px; padding: 10px;" 
                    : "background-color: transparent;";

                let cardPageDiv = document.createElement("div");
                cardPageDiv.className = "print-page page-break"; 
                cardPageDiv.innerHTML = `
                    <div class="birthday-card-container">
                        <img src="bg_birthday.jpg" class="bg-image-layer" alt="背景">
                        
                        <img src="${todayImgUrl}" class="dynamic-photo" alt="笑顔の写真">
                        
                        <div class="dynamic-text-area" style="${textAreaStyle}">
                            <div class="dynamic-name">${data.userName} 様</div>
                            <div class="dynamic-date">${displayDateText}</div>
                            <div class="dynamic-age">祝 ${bData.age}歳のお誕生日<br>おめでとうございます！</div>
                        </div>
                    </div>
                `;
                container.appendChild(cardPageDiv);
            }
        }
    </script>
</body>
</html>
