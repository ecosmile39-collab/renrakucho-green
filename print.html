<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>連絡帳 印刷画面</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #f0f8ff; padding: 20px; margin: 0; color: #333; }
        
        .no-print { background-color: white; padding: 20px; border-radius: 10px; max-width: 800px; margin: 0 auto 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #2b8a3e; margin-top: 0; }
        
        .nav-links { text-align: right; margin-bottom: 15px; }
        .nav-links a { color: #2b8a3e; font-weight: bold; text-decoration: none; margin-left: 15px; }
        .nav-links a:hover { text-decoration: underline; }

        .btn { padding: 10px 20px; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; }
        
        .filter-panel { background-color: #ebfbee; padding: 20px; border-radius: 8px; border: 2px solid #40c057; margin-bottom: 20px; }
        .filter-row { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; margin-bottom: 12px; }
        .filter-row:last-child { margin-bottom: 0; }
        .filter-label { font-weight: bold; font-size: 16px; min-width: 140px; color: #2b8a3e; }
        .filter-select { font-size: 16px; padding: 8px 12px; border-radius: 5px; border: 1px solid #40c057; font-weight: bold; }
        .date-input { font-size: 16px; padding: 8px; border-radius: 5px; border: 1px solid #ccc; }

        .user-select-box { background-color: #fff; padding: 20px; border-radius: 8px; border: 1px solid #ccc; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .user-checkbox-wrapper { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 15px; margin-bottom: 20px; }
        #userCheckboxes { display: block; }
        .line-user-group { margin: 18px 0; }
        .line-user-group h3 { margin: 0 0 12px; padding-bottom: 8px; border-bottom: 1px solid #ced4da; font-size: 16px; color: #495057; }
        .line-user-group[data-line-linked="true"] h3 { color: #237032; }
        .line-user-group .user-checkbox-wrapper { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .line-user-group .user-checkbox-label { min-width: 0; overflow-wrap: anywhere; }
        @media (max-width: 800px) { .user-checkbox-wrapper { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 500px) { .user-checkbox-wrapper { grid-template-columns: 1fr; } }
        @media (max-width: 800px) { .line-user-group .user-checkbox-wrapper { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media (max-width: 500px) { .line-user-group .user-checkbox-wrapper { grid-template-columns: minmax(0, 1fr); } }
        
        .user-row { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 8px; background-color: #f9f9f9; padding: 12px 15px; border: 1px solid #eee; border-radius: 5px; width: 100%; box-sizing: border-box; }
        .user-row:hover { background-color: #e6f2ff; border-color: #2b8a3e; }
        .user-checkbox-label { cursor: pointer; font-size: 16px; margin: 0; display: flex; align-items: center; gap: 6px; font-weight: bold; }
        .card-checkbox-label { cursor: pointer; font-size: 14px; color: #d6336c; font-weight: bold; margin: 0 0 0 5px; border-left: 3px solid #ccc; padding-left: 10px; display: flex; align-items: center; gap: 6px; }
        .card-msg-input { width: 90%; margin-left: 15px; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; box-sizing: border-box; }

        .btn-batch-print { background-color: #2b8a3e; font-size: 18px; padding: 12px 24px; width: 100%; margin-bottom: 10px; }
        .btn-batch-print:hover { background-color: #237032; }
        .btn-batch-exec { background-color: #e65100; font-size: 18px; padding: 12px 24px; width: 100%; display: none; }
        .btn-batch-exec:hover { background-color: #bf360c; }

        .scroll-btn-group { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 1000; }
        .scroll-btn { background-color: #2b8a3e; color: white; border: none; border-radius: 50%; width: 50px; height: 50px; font-size: 24px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); display: flex; justify-content: center; align-items: center; opacity: 0.8; }

        #printArea { width: 210mm; margin: 0 auto; }

        .print-page { 
            background-color: white; 
            padding: 10mm 15mm 10mm 20mm; 
            box-sizing: border-box; 
            margin-bottom: 30px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); 
            position: relative; 
            min-height: 297mm; 
            width: 100%;
        }
        
        .punch-mark {
            position: absolute;
            top: 50%;
            left: 2mm;
            transform: translateY(-50%); 
            color: #b0c4de; 
            font-size: 24px;
            user-select: none; 
        }

        .print-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-end; 
            margin-bottom: 12px; 
            border-bottom: 2px solid #333; 
            padding-bottom: 6px; 
        }
        .print-header h1 { margin: 0; font-size: 24px; letter-spacing: 1px; text-align: right; }
        .facility-name { font-size: 16px; font-weight: bold; color: #2b8a3e; }
        .print-date { text-align: right; font-size: 14px; margin-bottom: 10px; margin-top: 5px; font-weight: bold; color: #2b8a3e; }
        
        .birthday-banner { background-color: #fff0f5; color: #d2691e; text-align: center; font-size: 15px; font-weight: bold; padding: 6px 10px; margin: 0 0 10px 0; border: 2px dashed #ffb6c1; border-radius: 6px; }
        
        table.compact-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; font-size: 14px; }
        table.compact-table th, table.compact-table td { border: 1px solid #333; padding: 8px; text-align: center; }
        table.compact-table th { background-color: #f9f9f9; font-weight: normal; }
        table.compact-table td { font-weight: bold; }

        table.belongings-print-table { width: 100%; border-collapse: collapse; margin-bottom: 12px; font-size: 12px; }
        table.belongings-print-table th, table.belongings-print-table td { border: 1px solid #333; padding: 4px; text-align: center; }
        table.belongings-print-table th { background-color: #f0f0f0; }
        table.belongings-print-table td.item-name { text-align: left; padding-left: 6px; font-weight: normal; }

        .compact-avg { text-align: center; font-size: 14px; color: #333; margin: 10px 0; font-weight: bold; background-color: #fffacd; border: 1px solid #daa520; padding: 8px; border-radius: 5px; }
        
        .chart-container { height: 160px; width: 100%; position: relative; display: block; margin-bottom: 15px; }
        .section-title { font-weight: bold; font-size: 15px; margin-top: 15px; margin-bottom: 5px; border-bottom: 1px solid #ccc; padding-bottom: 3px; }
        .text-box { border: 1px solid #333; padding: 8px; font-size: 14px; min-height: 40px; white-space: pre-wrap; margin-bottom: 10px; border-radius: 3px; line-height: 1.4; }
        .family-box { min-height: 70px; }
        
        .media-print-area { display: flex; flex-wrap: wrap; gap: 15px; margin-top: 10px; justify-content: flex-start; }
        .media-print-box { text-align: center; }
        .media-print-box img.photo { max-height: 150px; max-width: 200px; object-fit: contain; border: 1px solid #ccc; padding: 2px; }
        .media-print-box img.qr { width: 110px; height: 110px; border: 1px solid #ccc; padding: 2px; margin-bottom: 2px; }
        .media-print-box .media-label { font-size: 12px; font-weight: bold; margin-bottom: 4px; }
        .media-print-box .line-friend-note { max-width: 130px; font-size: 10px; line-height: 1.35; }

        /* ==========================================
           🎉 誕生日カードの共通スタイル
           ========================================== */
        .birthday-card-container-v2 { 
            width: 100%; 
            position: relative; 
            overflow: hidden; 
            background-color: white; 
            container-type: inline-size; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .bg-image-layer-v2 { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; z-index: 1; }
        
        /* 写真を正方形に保ち、周りをフワッとぼかす設定 */
        .dynamic-photo-v2 { 
            position: absolute; 
            object-fit: cover; 
            z-index: 2; 
            aspect-ratio: 1 / 1; 
            border-radius: 10px; 
            -webkit-mask-image: radial-gradient(circle closest-side, black 60%, transparent 95%);
            mask-image: radial-gradient(circle closest-side, black 60%, transparent 95%);
        }

        .dynamic-text-area-v2 { position: absolute; z-index: 3; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; text-align: center; }
        
        .dynamic-name-v2 { font-weight: 900; color: #111; letter-spacing: 2px; white-space: nowrap; text-shadow: 3px 3px 0 #fff, -3px -3px 0 #fff, 3px -3px 0 #fff, -3px 3px 0 #fff, 0 3px 0 #fff, 0 -3px 0 #fff, 3px 0 0 #fff, -3px 0 0 #fff, 0 0 10px #fff, 0 0 10px #fff, 0 0 10px #fff; }
        .dynamic-date-v2 { font-weight: 900; color: #111; letter-spacing: 2px; white-space: nowrap; text-shadow: 3px 3px 0 #fff, -3px -3px 0 #fff, 3px -3px 0 #fff, -3px 3px 0 #fff, 0 3px 0 #fff, 0 -3px 0 #fff, 3px 0 0 #fff, -3px 0 0 #fff, 0 0 10px #fff, 0 0 10px #fff, 0 0 10px #fff; }
        .dynamic-age-v2 { font-weight: 900; color: #b91c1c; line-height: 1.4; text-align: center; white-space: nowrap; text-shadow: 3px 3px 0 #fff, -3px -3px 0 #fff, 3px -3px 0 #fff, -3px 3px 0 #fff, 0 3px 0 #fff, 0 -3px 0 #fff, 3px 0 0 #fff, -3px 0 0 #fff, 0 0 10px #fff, 0 0 10px #fff, 0 0 10px #fff; }
        .dynamic-staff-msg-v2 { font-weight: 900; color: #111; letter-spacing: 1px; text-align: center; line-height: 1.3; width: 95%; word-break: break-word; text-shadow: 3px 3px 0 #fff, -3px -3px 0 #fff, 3px -3px 0 #fff, -3px 3px 0 #fff, 0 3px 0 #fff, 0 -3px 0 #fff, 3px 0 0 #fff, -3px 0 0 #fff, 0 0 10px #fff, 0 0 10px #fff, 0 0 10px #fff; }

        /* ★ 新しく追加した「金色の祝長寿」用のスタイル ★ */
        .dynamic-chouju-v2 {
            position: absolute;
            width: 100%;
            text-align: center;
            font-weight: 900;
            z-index: 4;
            letter-spacing: 0.3em;
            color: #d4af37; /* 美しいゴールド色 */
            text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 0 2px 0 #fff, 0 -2px 0 #fff, 2px 0 0 #fff, -2px 0 0 #fff, 2px 4px 6px rgba(0,0,0,0.4);
            display: none; 
        }

        .card-longevity .dynamic-chouju-v2 {
            display: block;
            top: 1.5%;
            font-size: 6cqw;
            padding-left: 0.3em; 
        }

        .card-longevity.layout-vertical1 .dynamic-chouju-v2,
        .card-longevity.layout-vertical2 .dynamic-chouju-v2 {
            top: 6%;
            font-size: 8cqw;
        }

        .birthday-card-container-v2.layout-vertical2::before {
            content: "";
            position: absolute;
            z-index: 2;
            top: 18%;
            left: 22%;
            width: 56%;
            height: 18%;
            background: radial-gradient(ellipse, #f5e3df 55%, rgba(245, 227, 223, 0.96) 74%, transparent 100%);
            pointer-events: none;
        }

        /* ==========================================
           🎉 各デザイン個別の位置調整
           ========================================== */

        .birthday-card-container-v2.layout-vertical1,
        .birthday-card-container-v2.layout-vertical2 {
            aspect-ratio: 1 / 1.414;
        }

        /* 縦型1（鶴亀と松竹梅） */
        .layout-vertical1 .dynamic-photo-v2 { top: 18%; left: 25%; width: 50%; }
        .layout-vertical1 .dynamic-text-area-v2 { top: 55%; left: 10%; width: 80%; height: 40%; }
        .layout-vertical1 .dynamic-name-v2 { font-size: 5.5cqw; margin-bottom: 1.5cqw; }
        .layout-vertical1 .dynamic-date-v2 { font-size: 4.5cqw; margin-bottom: 1.5cqw; }
        .layout-vertical1 .dynamic-age-v2 { font-size: 6.5cqw; margin-bottom: 1.5cqw; }
        .layout-vertical1 .dynamic-staff-msg-v2 { font-size: 3.5cqw; margin-top: 3cqw; }

        /* 縦型2（ピンクの花柄と巻物） */
        .layout-vertical2 .dynamic-photo-v2 { top: 16%; left: 25%; width: 50%; }
        .layout-vertical2 .dynamic-text-area-v2 { top: 58%; left: 22%; width: 56%; height: 23%; padding-top: 3cqw; box-sizing: border-box; }
        .layout-vertical2 .dynamic-name-v2 { font-size: 4.0cqw; margin-bottom: 1.5cqw; }
        .layout-vertical2 .dynamic-date-v2 { font-size: 3.5cqw; margin-bottom: 1.5cqw; }
        .layout-vertical2 .dynamic-age-v2 { font-size: 5.0cqw; margin-bottom: 1.5cqw; }
        .layout-vertical2 .dynamic-staff-msg-v2 { font-size: 2.8cqw; margin-top: 2cqw; }

        .birthday-card-container-v2.layout-vertical3 { aspect-ratio: 2 / 3; }
        .layout-vertical3 .dynamic-photo-v2 { top: 46%; left: 27%; width: 46%; border-radius: 50%; -webkit-mask-image: radial-gradient(circle closest-side, black 60%, transparent 95%); mask-image: radial-gradient(circle closest-side, black 60%, transparent 95%); }
        .layout-vertical3 .dynamic-text-area-v2 { top: 12%; left: 28%; width: 46%; height: 22%; justify-content: center; }
        .layout-vertical3 .dynamic-name-v2 { font-size: 3.5cqw; margin-bottom: 0.6cqw; }
        .layout-vertical3 .dynamic-date-v2 { font-size: 3.1cqw; margin-bottom: 0.6cqw; }
        .layout-vertical3 .dynamic-age-v2 { font-size: 3.6cqw; margin-bottom: 0.4cqw; }
        .layout-vertical3 .dynamic-staff-msg-v2 { font-size: 2.2cqw; margin-top: 0.6cqw; }

        /* 横型の設定（A4横の比率） */
        .birthday-card-container-v2.layout-horizontal1,
        .birthday-card-container-v2.layout-horizontal2 {
            aspect-ratio: 1.414 / 1; 
        }

        /* 横型1（鶴亀と松竹梅） */
        .layout-horizontal1 .dynamic-photo-v2 { top: 24%; left: 32%; width: 36%; }
        .layout-horizontal1 .dynamic-text-area-v2 { top: 66%; left: 15%; width: 70%; height: 33%; }
        .layout-horizontal1 .dynamic-name-v2 { font-size: 2.0cqw; margin-bottom: 0.5cqw; }
        .layout-horizontal1 .dynamic-date-v2 { font-size: 1.8cqw; margin-bottom: 0.5cqw; }
        .layout-horizontal1 .dynamic-age-v2 { font-size: 2.8cqw; margin-bottom: 0.5cqw; }
        .layout-horizontal1 .dynamic-staff-msg-v2 { font-size: 1.6cqw; margin-top: 0.5cqw; }

        /* 横型2（ピンクの花柄と巻物） */
        .layout-horizontal2 .dynamic-photo-v2 { top: 21%; left: 31%; width: 38%; }
        .layout-horizontal2.card-two-photos .dynamic-photo-primary-v2 { top: 27%; left: 21%; width: 29%; }
        .layout-horizontal2.card-two-photos .dynamic-photo-secondary-v2 { display: block; top: 27%; left: 50%; width: 29%; }
        .layout-horizontal2 .dynamic-photo-secondary-v2 { display: none; }
        .layout-horizontal2 .dynamic-text-area-v2 { top: 66%; left: 26%; width: 48%; height: 26%; padding-top: 1cqw; box-sizing: border-box; }
        .layout-horizontal2 .dynamic-name-v2 { font-size: 2.2cqw; margin-bottom: 0.4cqw; }
        .layout-horizontal2 .dynamic-date-v2 { font-size: 1.9cqw; margin-bottom: 0.4cqw; }
        .layout-horizontal2 .dynamic-age-v2 { font-size: 3cqw; margin-bottom: 0.3cqw; }
        .layout-horizontal2 .dynamic-staff-msg-v2 { font-size: 2cqw; margin-top: 0.5cqw; transform: translateY(0.5cqw); }

        /* 横型3・4（折り紙の花） */
        .birthday-card-container-v2.layout-horizontal3,
        .birthday-card-container-v2.layout-horizontal4 { aspect-ratio: 1.49 / 1; }
        .layout-horizontal3 .dynamic-photo-v2,
        .layout-horizontal4 .dynamic-photo-v2 { top: 47%; left: 65%; width: 34%; border-radius: 50%; -webkit-mask-image: radial-gradient(circle closest-side, black 60%, transparent 95%); mask-image: radial-gradient(circle closest-side, black 60%, transparent 95%); }
        .layout-horizontal3 .dynamic-text-area-v2,
        .layout-horizontal4 .dynamic-text-area-v2 { top: 5%; left: 13%; width: 74%; height: 47%; justify-content: center; }
        .layout-horizontal3 .dynamic-name-v2,
        .layout-horizontal4 .dynamic-name-v2 { font-size: 3cqw; margin-bottom: 0.7cqw; }
        .layout-horizontal3 .dynamic-date-v2,
        .layout-horizontal4 .dynamic-date-v2 { font-size: 2.5cqw; margin-bottom: 0.7cqw; }
        .layout-horizontal3 .dynamic-age-v2,
        .layout-horizontal4 .dynamic-age-v2 { font-size: 3.8cqw; margin-bottom: 0.5cqw; }
        .layout-horizontal3 .dynamic-staff-msg-v2,
        .layout-horizontal4 .dynamic-staff-msg-v2 { font-size: 2.3cqw; margin-top: 0.7cqw; }

        .print-only { display: none; }

        /* ==========================================
           🌟 誕生日カード「のみ」を印刷する場合の特別スタイル
           ========================================== */
        body.mode-card-only #printArea { width: 100%; max-width: 600px; margin: 0 auto; }
        body.mode-card-only .print-page { padding: 0; min-height: auto; box-shadow: none; margin-bottom: 20px; background: transparent; }

        /* ==========================================
           🖨️ 印刷時専用のスタイル（★余白なし・用紙ピッタリ機能の完全版★）
           ========================================== */
        @media print {
            @page { 
                margin: 0; 
                size: auto; 
            } 
            
            html, body { 
                width: 100%; 
                height: 100%; 
                margin: 0 !important; 
                padding: 0 !important; 
                background-color: white; 
                -webkit-print-color-adjust: exact; 
                print-color-adjust: exact; 
            }
            .no-print { display: none !important; }
            
            body:not(.mode-card-only) #printArea { max-width: 100% !important; margin: 0 !important; width: 210mm !important; }
            body:not(.mode-card-only) .print-page { 
                padding: 5mm 12mm 4mm 15mm !important; 
                box-shadow: none !important; 
                width: 210mm !important; 
                min-height: 297mm !important; 
                page-break-after: always !important; 
                margin: 0 !important; 
                position: relative !important; 
                box-sizing: border-box !important;
            }
            body:not(.mode-card-only) .birthday-card-container-v2.layout-vertical1,
            body:not(.mode-card-only) .birthday-card-container-v2.layout-vertical2 { 
                height: 288mm !important; box-shadow: none !important; 
            }
            body:not(.mode-card-only) .birthday-card-container-v2.layout-horizontal1,
            body:not(.mode-card-only) .birthday-card-container-v2.layout-horizontal2,
            body:not(.mode-card-only) .birthday-card-container-v2.layout-horizontal3,
            body:not(.mode-card-only) .birthday-card-container-v2.layout-horizontal4 { 
                height: auto !important; margin-top: 15mm !important; box-shadow: none !important; 
            }

            /* ★★★【カードのみモード】選んだ用紙にピタッと余白なしで収まる設定 ★★★ */
            body.mode-card-only #printArea,
            body.mode-card-only .print-page,
            body.mode-card-only .birthday-card-container-v2 {
                position: fixed !important;
                inset: 0 !important;
                width: 100% !important;
                height: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                box-shadow: none !important;
                border: none !important;
                max-width: none !important;
                max-height: none !important;
                aspect-ratio: auto !important; /* 選んだ用紙の比率に強制的に合わせる */
                box-sizing: border-box !important;
                page-break-inside: avoid !important;
                page-break-after: avoid !important;
                page-break-before: avoid !important;
            }
            
            body.mode-card-only .bg-image-layer-v2 {
                position: absolute !important;
                inset: 0 !important;
                width: 100% !important;
                height: 100% !important;
                object-fit: contain !important;
            }

            /* カードのみ印刷では、用紙の印刷領域を通常レイアウトの基準にする */
            body.mode-card-only #printArea {
                position: relative !important;
                width: 100vw !important;
                height: 100vh !important;
                min-width: 100vw !important;
                min-height: 100vh !important;
            }
            body.mode-card-only .print-page {
                position: relative !important;
                width: 100vw !important;
                height: 100vh !important;
                min-width: 100vw !important;
                min-height: 100vh !important;
            }
            body.mode-card-only .birthday-card-container-v2 {
                position: relative !important;
                width: 100vw !important;
                height: 100vh !important;
                min-width: 100vw !important;
                min-height: 100vh !important;
            }
            .birthday-card-container-v2 { 
                font-size: 2vw !important; 
            }

            .dynamic-photo-v2 {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                -webkit-mask-image: radial-gradient(circle closest-side, black 60%, transparent 95%) !important;
                mask-image: radial-gradient(circle closest-side, black 60%, transparent 95%) !important;
            }
            
            .dynamic-chouju-v2 {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            .print-only { display: block !important; }
            .page-break { page-break-before: always !important; padding: 0 !important; }
            .punch-mark { display: none !important; } 
            .text-box, .family-box, table, tr, .section-title, .media-print-area, .chart-container, .birthday-card-container-v2 { page-break-inside: avoid !important; break-inside: avoid !important; }
            
            /* 以下は連絡帳用のスタイル */
            .print-header { margin-bottom: 2mm !important; padding-bottom: 1mm !important; border-bottom: 2px solid #333 !important; }
            .print-header h1 { font-size: 18px !important; margin: 0 !important; }
            .facility-name { font-size: 14px !important; font-weight: bold !important; }
            .print-date { margin-bottom: 2mm !important; font-size: 11px !important; font-weight: bold !important; }
            h2 { font-size: 16px !important; margin: 0 !important; }
            
            table.compact-table { margin-bottom: 4mm !important; font-size: 12px !important; }

</head>
<body>
    <div class="no-print">
        <h2 style="color: #2b8a3e; margin-top: 0;">🖨️ <span id="displayFacilityName">施設名読込中...</span> 連絡帳（印刷・確認画面）</h2>
        
        <div class="nav-links">
            <a href="index.html">⬅ 入力画面へ戻る</a>
            <a href="history.html">➡ 過去データ一覧へ</a>
        </div>

        <div class="filter-panel">
            <div class="filter-row">
                <span class="filter-label">📌 サービス種別：</span>
                <select id="selectServiceType" class="filter-select" onchange="onServiceTypeChanged()">
                    <option value="デイサービス" selected>☀️ デイサービス（日帰り）</option>
                    <option value="ショートステイ">🌙 ショートステイ（宿泊）</option>
                    <option value="放課後等デイサービス">🎒 放課後等デイサービス</option>
                    <option value="児童発達支援">🧸 児童発達支援</option>
                    <option value="生活介護">♿ 生活介護</option>
                </select>
            </div>

            <div class="filter-row" id="dayServiceDateRow">
                <span class="filter-label">📅 ご利用日：</span>
                <input type="date" id="singleDate" class="date-input" onchange="onDateChanged()">
            </div>

            <div class="filter-row" id="shortStayDateRow" style="display: none;">
                <span class="filter-label">📅 ご宿泊期間：</span>
                <input type="date" id="startDate" class="date-input" onchange="onDateChanged()">
                <span style="font-weight: bold;">～</span>
                <input type="date" id="endDate" class="date-input" onchange="onDateChanged()">
            </div>
            
            <div class="filter-row" style="margin-top: 15px; border-top: 1px dashed #40c057; padding-top: 15px;">
                <span class="filter-label">🖨️ 印刷する内容：</span>
                <select id="selectPrintTarget" class="filter-select" onchange="onCardBgChanged()">
                    <option value="both" selected>連絡帳 ＋ 誕生日カード（A4用紙）</option>
                    <option value="report_only">連絡帳のみ（A4用紙）</option>
                    <option value="card_only">誕生日カードのみ（L版やB5など用紙自由）</option>
                </select>
            </div>
            
            <div class="filter-row">
                <span class="filter-label">📇 誕生日カードのデザイン：</span>
                <select id="selectCardOrientation" class="filter-select" onchange="onCardBgChanged(); updateCardPhotoCountVisibility()">
                    <option value="vertical1" selected>縦型1（鶴亀と松竹梅）</option>
                    <option value="vertical2">縦型2（ピンクの花柄）</option>
                    <option value="vertical3">縦型3（どうぶつフレーム）</option>
                    <option value="horizontal1">横型1（鶴亀と松竹梅）</option>
                    <option value="horizontal2">横型2（ピンクの花柄）</option>
                    <option value="horizontal3">横型3（折り紙の花・緑）</option>
                    <option value="horizontal4">横型4（折り紙の花・赤）</option>
                </select>
            </div>

            <div class="filter-row" id="cardPhotoCountRow" style="display: none;">
                <span class="filter-label">📷 横型2の写真枚数：</span>
                <select id="cardPhotoCount" class="filter-select" onchange="onCardBgChanged()">
                    <option value="1" selected>1枚</option>
                    <option value="2">2枚（左右に表示）</option>
                </select>
            </div>
            
            <div class="filter-row">
                <span class="filter-label">🎨 誕生日カードの文字背景：</span>
                <select id="selectCardBg" class="filter-select" onchange="onCardBgChanged()">
                    <option value="transparent" selected>透明（イラストをそのまま活かす）</option>
                    <option value="white">白色（文字をくっきりと読みやすくする）</option>
                </select>
            </div>
        </div>
        
        <div class="user-select-box" id="userSelectBox" style="display: none;">
            <div id="selectBoxTitle" style="font-weight: bold; color: #2b8a3e; margin-bottom: 15px; font-size: 18px;">
                ☑ 印刷するお客様を選んでください
            </div>
            
            <label style="font-weight: bold; border-bottom: 2px dashed #ccc; padding-bottom: 10px; display: block; cursor: pointer; margin-bottom: 15px;">
                <input type="checkbox" id="checkAll" checked onchange="toggleAllUsers()"> すべて選択／解除
            </label>
            
            <div class="user-checkbox-wrapper" id="userCheckboxes"></div>
            
            <button class="btn btn-batch-print" id="batchPrintBtn" onclick="loadSelectedAndPrint()">
                📄 選んだ人の連絡帳を画面に表示する（確認用）
            </button>
            
            <button class="btn btn-batch-exec" id="batchPrintExecBtn" onclick="window.print()">
                🖨️ 確認OK！表示されている連絡帳をプリンターで一括印刷する
            </button>
        </div>
    </div>

    <div id="printArea"></div>

    <div class="scroll-btn-group no-print" id="scrollGroup">
        <button class="scroll-btn" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">▲</button>
        <button class="scroll-btn" onclick="window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'})">▼</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { hasFacilitySession } from "./facility-auth.js";
        import { getFirestore, collection, getDocs, query, where, doc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-functions.js";
        import { getStorage, ref, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";
        import { normalizeServiceTypes, populateServiceTypeSelect } from "./service-types.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCLExSyJnb5zvjMbGXv7EsCGFYQf9WZeYg",
            authDomain: "renrakucho-app-6b157.firebaseapp.com",
            projectId: "renrakucho-app-6b157",
            storageBucket: "renrakucho-app-6b157.firebasestorage.app",
            messagingSenderId: "63418706991",
            appId: "1:63418706991:web:43085ce485d2a3d6302ada"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const functions = getFunctions(app);
        const storage = getStorage(app);
        const facilityId = localStorage.getItem("currentFacilityId");

        let chartInstances = [];
        window.globalUsersData = {};
        window.matchedRecordsGlobal = [];
        const mediaUrlCache = new Map();
        let facilityLineFriendQrHtml = "";
        let facilityLineEnabled = false;
        const pairingCodesByUser = new Map();
        const pairingCodeUnsubscribers = new Map();
        const lineLinkedUsers = new Set();
        
        const defaultIcon = "data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==";

        function renderCustomFieldPrintHtml(record) {
            const fields = (Array.isArray(record.customFields) ? record.customFields : []).filter(field =>
                field && typeof field.label === "string" && field.value !== "" && field.value !== undefined && field.value !== null
            );
            if (!fields.length) return "";
            const escapeHtml = value => String(value).replace(/[&<>"']/g, character => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
            }[character]));
            return `<div class="custom-record-fields"><div class="section-title">■ 施設独自項目</div>${fields.map(field => {
                const value = field.type === "checkbox" ? (field.value === true ? "はい" : "いいえ") : String(field.value);
                return `<div class="text-box"><strong>${escapeHtml(field.label)}</strong>：${escapeHtml(value).replace(/\n/g, "<br>")}</div>`;
            }).join("")}</div>`;
        }

        function isFormSectionVisible(record, sectionId) {
            return !Array.isArray(record.hiddenFormSections) || !record.hiddenFormSections.includes(sectionId);
        }

        function escapePrintHtml(value) {
            return String(value).replace(/[&<>"']/g, character => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
            }[character]));
        }

        function renderFacilityLinePrintHtml(userName) {
            const friendQrHtml = !lineLinkedUsers.has(userName) && facilityLineFriendQrHtml
                ? facilityLineFriendQrHtml.replace(
                    'class="media-print-box"',
                    `class="media-print-box line-friend-qr" data-line-friend-user="${escapePrintHtml(userName)}"`
                )
                : "";
            const pairing = pairingCodesByUser.get(userName);
            const pairingCodeHtml = !lineLinkedUsers.has(userName) && pairing && pairing.expiresAt > Date.now()
                ? `<div class="media-print-box line-pairing-code" data-line-pairing-user="${escapePrintHtml(userName)}"><div class="media-label">保護者LINE連携コード</div><strong>${escapePrintHtml(pairing.code)}</strong><div class="line-friend-note">この利用者専用・24時間以内に左のQRから施設LINEを友だち追加し、このコードをトークに送信してください。送信すると連携が完了します。</div></div>`
                : "";
            return friendQrHtml + pairingCodeHtml;
        }

        function clearPairingCodeListeners() {
            pairingCodeUnsubscribers.forEach(unsubscribe => unsubscribe());
            pairingCodeUnsubscribers.clear();
        }

        async function preparePairingCodes(userNames, printTarget) {
            clearPairingCodeListeners();
            if (!facilityLineEnabled || printTarget === "card_only") return;

            const createPairingCode = httpsCallable(functions, "createLinePairingCode");
            await Promise.all(userNames.map(async userName => {
                if (lineLinkedUsers.has(userName)) return;
                const userRef = doc(db, "facilities", facilityId, "users", userName);
                try {
                    const userSnapshot = await getDoc(userRef);
                    if (!userSnapshot.exists()) return;
                    if ((userSnapshot.data().lineUserIds || []).length > 0) {
                        lineLinkedUsers.add(userName);
                        pairingCodesByUser.delete(userName);
                        return;
                    }

                    let pairing = pairingCodesByUser.get(userName);
                    if (!pairing || pairing.expiresAt <= Date.now()) {
                        const result = await createPairingCode({ userName });
                        pairing = {
                            code: result.data.code,
                            expiresAt: Date.now() + result.data.expiresInHours * 60 * 60 * 1000
                        };
                        pairingCodesByUser.set(userName, pairing);
                    }

                    if (!pairingCodeUnsubscribers.has(userName)) {
                        const unsubscribe = onSnapshot(userRef, snapshot => {
                            if (!snapshot.exists() || (snapshot.data().lineUserIds || []).length === 0) return;
                            lineLinkedUsers.add(userName);
                            pairingCodesByUser.delete(userName);
                            document.querySelectorAll(".line-pairing-code").forEach(element => {
                                if (element.dataset.linePairingUser === userName) element.remove();
                            });
                            document.querySelectorAll(".line-friend-qr").forEach(element => {
                                if (element.dataset.lineFriendUser === userName) element.remove();
                            });
                            pairingCodeUnsubscribers.get(userName)?.();
                            pairingCodeUnsubscribers.delete(userName);
                        }, error => console.warn("LINE連携状態を更新できませんでした:", error));
                        pairingCodeUnsubscribers.set(userName, unsubscribe);
                    }
                } catch (error) {
                    console.warn(`${userName} 様のLINE連携コードを発行できませんでした:`, error);
                }
            }));
        }

        window.onload = async function() {
            let facilityId = localStorage.getItem("currentFacilityId");
            if (!facilityId) { window.location.replace("login.html"); return; }
            if (!(await hasFacilitySession(auth, facilityId))) {
                localStorage.removeItem("currentFacilityId");
                localStorage.removeItem("currentFacilityName");
                localStorage.removeItem("isStaffAuthenticated");
                window.location.replace("login.html");
                return;
            }

            facilityLineFriendQrHtml = await loadFacilityLineFriendQr();

            const facilitySnapshot = await getDoc(doc(db, "facilities", facilityId));
            const enabledServiceTypes = normalizeServiceTypes(
                facilitySnapshot.exists() ? facilitySnapshot.data().enabledServiceTypes : undefined
            );
            
            let facilityName = localStorage.getItem("currentFacilityName") || "連絡帳アプリ";
            let nameEl = document.getElementById("displayFacilityName");
            if (nameEl) nameEl.textContent = facilityName;

            let today = new Date();
            let year = today.getFullYear();
            let month = String(today.getMonth() + 1).padStart(2, '0');
            let day = String(today.getDate()).padStart(2, '0');
            let todayStr = `${year}-${month}-${day}`;
            
            document.getElementById("singleDate").value = todayStr;
            document.getElementById("startDate").value = todayStr;
            document.getElementById("endDate").value = todayStr;

            let savedServiceType = localStorage.getItem('currentServiceType');
            const selectedServiceType = populateServiceTypeSelect(
                document.getElementById("selectServiceType"),
                enabledServiceTypes,
                savedServiceType
            );
            localStorage.setItem("currentServiceType", selectedServiceType);
            updateCardPhotoCountVisibility();
            
            await loadUserNames(facilityId);
            onServiceTypeChanged();
        };

        async function loadFacilityLineFriendQr() {
            try {
                const getStatus = httpsCallable(functions, "getFacilityLineSettingsStatus");
                const result = await getStatus({});
                const settings = result.data;
                const isDedicatedLine = settings.configured === true;
                const isLineEnabled = isDedicatedLine
                    ? settings.lineEnabled === true
                    : settings.commonLineEnabled === true && settings.lineEnabled === true;
                facilityLineEnabled = isLineEnabled;
                if (!isLineEnabled || !settings.basicId) return "";

                const addFriendUrl = `https://line.me/R/ti/p/${encodeURIComponent(settings.basicId)}`;
                const qr = new QRious({ value: addFriendUrl, size: 180 });
                const accountLabel = isDedicatedLine ? "施設LINE" : "共通LINE";
                return `<div class="media-print-box"><div class="media-label">LINE友だち追加</div><img src="${qr.toDataURL()}" class="qr" alt="${accountLabel}友だち追加QRコード"><div class="line-friend-note"><strong>${accountLabel}許可中</strong><br>スマートフォンで読み取って友だち追加</div></div>`;
            } catch (error) {
                facilityLineEnabled = false;
                console.warn("施設LINEの友だち追加QRを表示できませんでした:", error);
                return "";
            }
        }

        async function loadUserNames(facilityId) {
            try {
                let usersRef = collection(db, "facilities", facilityId, "users");
                let snapshot = await getDocs(usersRef);
                window.globalUsersData = {}; 
                snapshot.forEach((docSnap) => {
                    window.globalUsersData[docSnap.id] = docSnap.data();
                });
            } catch (error) { console.log("名簿エラー:", error); }
        }

        window.onServiceTypeChanged = function() {
            let sType = document.getElementById("selectServiceType").value;
            localStorage.setItem('currentServiceType', sType);

            if (sType !== "ショートステイ") {
                document.getElementById("dayServiceDateRow").style.display = "flex";
                document.getElementById("shortStayDateRow").style.display = "none";
            } else {
                document.getElementById("dayServiceDateRow").style.display = "none";
                document.getElementById("shortStayDateRow").style.display = "flex";
            }
            onDateChanged();
        };

        window.onDateChanged = async function() {
            clearPairingCodeListeners();
            let facilityId = localStorage.getItem("currentFacilityId");
            let sType = document.getElementById("selectServiceType").value;
            
            let startDate = (sType !== "ショートステイ") ? document.getElementById("singleDate").value : document.getElementById("startDate").value;
            let endDate = (sType !== "ショートステイ") ? document.getElementById("singleDate").value : document.getElementById("endDate").value;

            let selectBox = document.getElementById("userSelectBox");
            let checkboxesArea = document.getElementById("userCheckboxes");
            
            document.getElementById("printArea").innerHTML = "";
            document.getElementById("batchPrintExecBtn").style.display = "none";
            document.getElementById("batchPrintBtn").style.display = "none";
            
            if (!startDate || !endDate || !facilityId) {
                selectBox.style.display = "none";
                return;
            }

            if (startDate > endDate) {
                selectBox.style.display = "block";
                checkboxesArea.innerHTML = `<span style="color: red; font-weight: bold;">エラー：開始日は終了日より前の日付を指定してください。</span>`;
                return;
            }

            selectBox.style.display = "block";
            checkboxesArea.innerHTML = `⏳ 【${sType}】の利用データを検索中...`;

            try {
                let recordsRef = collection(db, "facilities", facilityId, "daily_records");
                let q = query(recordsRef, where("date", ">=", startDate), where("date", "<=", endDate));
                let snapshot = await getDocs(q);

                window.matchedRecordsGlobal = [];
                let uniqueUsers = new Set();

                snapshot.forEach(docSnap => {
                    let data = docSnap.data();
                    let recordService = data.serviceType || "デイサービス";

                    if (recordService === sType) {
                        let userData = window.globalUsersData[data.userName];
                        let userServices = userData && (userData.services || (userData.serviceType ? [userData.serviceType] : null));
                        if (userServices && !userServices.includes(sType)) return;
                        window.matchedRecordsGlobal.push(data);
                        uniqueUsers.add(data.userName);
                    }
                });

                if (window.matchedRecordsGlobal.length === 0) {
                    let periodText = (startDate === endDate) ? `${startDate}` : `${startDate} ～ ${endDate}`;
                    checkboxesArea.innerHTML = `<span style="color: red; font-weight: bold;">${periodText} の【${sType}】の連絡帳データはありません。</span>`;
                    return;
                }

                checkboxesArea.innerHTML = "";
                document.getElementById("checkAll").checked = true;

                const userNames = Array.from(uniqueUsers).sort();
                const lineGroups = new Map();
                for (const linked of [false, true]) {
                    const members = userNames.filter(name => {
                        const lineUserIds = window.globalUsersData[name]?.lineUserIds;
                        return (Array.isArray(lineUserIds) && lineUserIds.length > 0) === linked;
                    });
                    const section = document.createElement("section");
                    section.className = "line-user-group";
                    section.dataset.lineLinked = String(linked);
                    const heading = document.createElement("h3");
                    heading.textContent = `${linked ? "LINE連携済み" : "LINE未連携"}（${members.length}名）`;
                    section.appendChild(heading);
                    const list = document.createElement("div");
                    list.className = "user-checkbox-wrapper";
                    if (!members.length) {
                        const empty = document.createElement("p");
                        empty.textContent = "対象の利用者はいません。";
                        section.appendChild(empty);
                    }
                    section.appendChild(list);
                    checkboxesArea.appendChild(section);
                    lineGroups.set(linked, list);
                }
                
                userNames.forEach((userName) => {
                    let uData = window.globalUsersData[userName];
                    let isCardOnly = document.getElementById("selectPrintTarget").value === "card_only";
                    let bData = getBirthdayData(uData ? uData.birthday : null, endDate, sType === "ショートステイ", startDate, endDate, isCardOnly);

                    let div = document.createElement("div");
                    div.className = "user-row";
                    
                    let userLbl = document.createElement("label");
                    userLbl.className = "user-checkbox-label";
                    userLbl.innerHTML = `<input type="checkbox" class="user-chk" value="${userName}" checked> ${userName} 様`;
                    div.appendChild(userLbl);

                    let linkedLineCount = Array.isArray(uData?.lineUserIds) ? uData.lineUserIds.length : 0;
                    let lineStatus = document.createElement("span");
                    lineStatus.textContent = linkedLineCount
                        ? `保護者LINE：${linkedLineCount}件連携済み`
                        : "保護者LINE：未連携";
                    lineStatus.style.fontSize = "12px";
                    lineStatus.style.color = linkedLineCount ? "#237032" : "#6c757d";
                    div.appendChild(lineStatus);

                    if (bData) {
                        let cardLbl = document.createElement("label");
                        cardLbl.className = "card-checkbox-label";
                        let isChecked = (bData.diffDays <= 0) ? "checked" : "";
                        cardLbl.innerHTML = `<input type="checkbox" class="card-chk" value="${userName}" ${isChecked}> 🎁 誕生日カードも印刷`;
                        div.appendChild(cardLbl);
                        
                        let msgInput = document.createElement("input");
                        msgInput.type = "text";
                        msgInput.className = "card-msg-input";
                        msgInput.id = "card_msg_" + userName;
                        msgInput.placeholder = "カード用メッセージを入力(任意: いつも笑顔を…等)";
                        div.appendChild(msgInput);
                    }
                    
                    lineGroups.get(linkedLineCount > 0).appendChild(div);
                });

                document.getElementById("batchPrintBtn").style.display = "block";
                document.getElementById("batchPrintBtn").textContent = `📄 【${sType}】の連絡帳を画面に表示する（確認用）`;
                document.getElementById("batchPrintBtn").disabled = false;

            } catch (error) {
                checkboxesArea.innerHTML = "検索エラー: " + error.message;
            }
        };

        window.toggleAllUsers = function() {
            let isChecked = document.getElementById("checkAll").checked;
            document.querySelectorAll(".user-chk").forEach(chk => chk.checked = isChecked);
        };

        window.updateCardPhotoCountVisibility = function() {
            let isHorizontal2 = document.getElementById("selectCardOrientation").value === "horizontal2";
            document.getElementById("cardPhotoCountRow").style.display = isHorizontal2 ? "flex" : "none";
        };

        window.onCardBgChanged = function() {
            const refreshButton = document.getElementById("batchPrintBtn");
            const hasRenderedOutput = document.getElementById("printArea").children.length > 0;
            if (hasRenderedOutput && refreshButton && !refreshButton.disabled) {
                loadSelectedAndPrint();
            }
        };

        window.loadSelectedAndPrint = async function() {
            let facilityId = localStorage.getItem("currentFacilityId");
            let sType = document.getElementById("selectServiceType").value;
            let startDate = (sType !== "ショートステイ") ? document.getElementById("singleDate").value : document.getElementById("startDate").value;
            let endDate = (sType !== "ショートステイ") ? document.getElementById("singleDate").value : document.getElementById("endDate").value;

        async function getCachedUrl(path) {
            if (mediaUrlCache.has(path)) return mediaUrlCache.get(path);

                return url;
            } catch(e) {
                return null;
            }
        }

        function getBirthdayData(birthdayStr, targetDateStr, isShortStay = false, startDateStr = null, endDateStr = null, allowAnyDate = false) {
            if (!birthdayStr) return null;
            const bParts = birthdayStr.split("-");
            if (bParts.length < 3) return null;
            const bYear = parseInt(bParts[0], 10);
            const bMonth = parseInt(bParts[1], 10);
            const bDay = parseInt(bParts[2], 10);

            if (!isShortStay) {
                const tParts = targetDateStr.split("-");
                const tYear = parseInt(tParts[0], 10);
                const targetDate = new Date(tYear, parseInt(tParts[1], 10) - 1, parseInt(tParts[2], 10));

                for (let y of [tYear, tYear - 1, tYear + 1]) {
                    const bDate = new Date(y, bMonth - 1, bDay);
                    const age = y - bYear;
                    const diffDays = Math.round((targetDate - bDate) / (1000 * 60 * 60 * 24));
                    if (diffDays >= 0 && diffDays <= 3) {
                        return { isToday: (diffDays === 0), month: bMonth, day: bDay, age: age, diffDays: diffDays };
                    }
                }
                if (allowAnyDate) {
                    const birthdayPassed = (parseInt(tParts[1], 10) > bMonth) || (parseInt(tParts[1], 10) === bMonth && parseInt(tParts[2], 10) >= bDay);
                    return { isToday: false, month: bMonth, day: bDay, age: tYear - bYear - (birthdayPassed ? 0 : 1), diffDays: 0 };
                }
                return null;
            } else {
                const sParts = startDateStr.split("-");
                const eParts = endDateStr.split("-");
                const sYear = parseInt(sParts[0], 10);
                const sDate = new Date(sYear, parseInt(sParts[1], 10) - 1, parseInt(sParts[2], 10));
                const eDate = new Date(parseInt(eParts[0], 10), parseInt(eParts[1], 10) - 1, parseInt(eParts[2], 10));

                for (let y of [sYear, sYear - 1, sYear + 1]) {
                    const bDate = new Date(y, bMonth - 1, bDay);
                    const age = y - bYear;
                    if (bDate >= sDate && bDate <= eDate) {
                        return { isToday: true, month: bMonth, day: bDay, age: age, diffDays: 0 };
                    }
                    const diffDaysFromEnd = Math.round((eDate - bDate) / (1000 * 60 * 60 * 24));
                    if (diffDaysFromEnd > 0 && diffDaysFromEnd <= 3) {
                        return { isToday: false, month: bMonth, day: bDay, age: age, diffDays: diffDaysFromEnd };
                    }
                }
                if (allowAnyDate) {
                    const targetYear = parseInt(eParts[0], 10);
                    const birthdayPassed = (parseInt(eParts[1], 10) > bMonth) || (parseInt(eParts[1], 10) === bMonth && parseInt(eParts[2], 10) >= bDay);
                    return { isToday: false, month: bMonth, day: bDay, age: targetYear - bYear - (birthdayPassed ? 0 : 1), diffDays: 0 };
                }
                return null;
            }
        }

                if (!todayImgUrl) todayImgUrl = await getCachedUrl(`faces/${facilityId}/${data.userName}/face.jpg`) || defaultIcon;
                let secondImgUrl = cardOrientationChoice === "horizontal2" && cardPhotoCount === 2
                    ? await getCachedUrl(`images/${facilityId}/${data.userName}/image_2.jpg`) || await getCachedUrl(`faces/${facilityId}/${data.userName}/face.jpg`) || defaultIcon
                    : "";

                let currentYear = parseInt(data.date.substring(0,4));
                let reiwaYear = currentYear - 2018;
                let reiwaText = reiwaYear === 1 ? "元" : reiwaYear;
                let displayDateText = `令和${reiwaText}年 ${bData.month}月${bData.day}日`;

                let cardBgChoice = document.getElementById("selectCardBg").value;
                let textAreaStyle = cardBgChoice === "white" 
                    ? "background-color: white; border-radius: 10px; padding: 10px;" 
                    : "background-color: transparent;";

                let staffMsgHtml = cardMessage ? `<div class="dynamic-staff-msg-v2">${cardMessage}</div>` : "";

                let cardPageDiv = document.createElement("div");
                cardPageDiv.className = "print-page page-break"; 
                
                // ★ 選択されたデザインに応じてクラスと画像を切り替える ★
                let layoutClass = "";
                let bgImageSrc = "";
                
                if (cardOrientationChoice === "vertical1") {
                    layoutClass = "layout-vertical1";
                    bgImageSrc = "bg_birthday.jpg";
                } else if (cardOrientationChoice === "vertical2") {
                    layoutClass = "layout-vertical2";
                    bgImageSrc = "bg_birthday_v2.jpg";
                } else if (cardOrientationChoice === "vertical3") {
                    layoutClass = "layout-vertical3";
                    bgImageSrc = "functions/b1.png";
                } else if (cardOrientationChoice === "horizontal1") {
                    layoutClass = "layout-horizontal1";
                    bgImageSrc = "bg_birthday_h_2.jpg"; 
                } else if (cardOrientationChoice === "horizontal2") {
                    layoutClass = "layout-horizontal2";
                    bgImageSrc = "bg_birthday_h_1.jpg"; 
                } else if (cardOrientationChoice === "horizontal3") {
                    layoutClass = "layout-horizontal3";
                    bgImageSrc = "functions/B2.png";
                } else if (cardOrientationChoice === "horizontal4") {
                    layoutClass = "layout-horizontal4";
                    bgImageSrc = "functions/B3.png";
                }

                cardPageDiv.innerHTML = `
                    <div class="birthday-card-container-v2 ${layoutClass}${Number(bData.age) >= 70 ? " card-longevity" : ""}${secondImgUrl ? " card-two-photos" : ""}">
                        <img src="${bgImageSrc}" class="bg-image-layer-v2" alt="背景">
                        <div class="dynamic-chouju-v2">祝 長 寿</div>
                        <img src="${todayImgUrl}" class="dynamic-photo-v2 dynamic-photo-primary-v2" alt="利用者の写真1">
                        ${secondImgUrl ? `<img src="${secondImgUrl}" class="dynamic-photo-v2 dynamic-photo-secondary-v2" alt="利用者の写真2">` : ""}
                        <div class="dynamic-text-area-v2" style="${textAreaStyle}">
                            <div class="dynamic-name-v2">${data.userName} 様</div>
                            <div class="dynamic-date-v2">${displayDateText}</div>
                            <div class="dynamic-age-v2">祝 ${bData.age}歳のお誕生日<br>おめでとうございます！</div>
                            ${staffMsgHtml}
                        </div>
                    </div>
                `;
                container.appendChild(cardPageDiv);
            }
        }
    </script>
</body>
</html>
