<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワード変更 - 連絡帳アプリ</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f8ff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .box { background: white; width: 100%; max-width: 440px; padding: 35px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); box-sizing: border-box; }
        h1 { color: #4682b4; font-size: 24px; text-align: center; margin: 0 0 22px; }
        label { display: block; font-weight: bold; margin-top: 14px; color: #495057; }
        input { width: 100%; padding: 12px; margin-top: 6px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 14px; margin-top: 22px; background: #ff7f50; color: white; border: 0; border-radius: 5px; font-size: 17px; font-weight: bold; cursor: pointer; }
        button:hover { background: #ff6347; }
        .message { display: none; margin-top: 15px; font-weight: bold; line-height: 1.5; }
        .error { color: #c92a2a; }
        .success { color: #2b8a3e; }
        .back { display: block; margin-top: 20px; text-align: center; color: #4682b4; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>
    <main class="box">
        <h1>🔑 パスワードを変更する</h1>
        <label for="facilityName">施設名</label>
        <input type="text" id="facilityName" placeholder="例：さくらデイサービス">
        <label for="currentPassword">現在のパスワード</label>
        <input type="password" id="currentPassword">
        <label for="newPassword">新しいパスワード</label>
        <input type="password" id="newPassword">
        <label for="confirmPassword">新しいパスワード（確認）</label>
        <input type="password" id="confirmPassword">
        <button type="button" onclick="changePassword()">パスワードを変更する</button>
        <p id="message" class="message"></p>
        <a href="login.html" class="back">⬅ ログイン画面へ戻る</a>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCLExSyJnb5zvjMbGXv7EsCGFYQf9WZeYg",
            authDomain: "renrakucho-app-6b157.firebaseapp.com",
            projectId: "renrakucho-app-6b157",
            storageBucket: "renrakucho-app-6b157.firebasestorage.app",
            messagingSenderId: "63418706991",
            appId: "1:63418706991:web:43085ce485d2a3d6302ada"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        function showMessage(text, type) {
            let message = document.getElementById("message");
            message.textContent = text;
            message.className = `message ${type}`;
            message.style.display = "block";
        }

        window.changePassword = async function() {
            let facilityName = document.getElementById("facilityName").value.trim();
            let currentPassword = document.getElementById("currentPassword").value;
            let newPassword = document.getElementById("newPassword").value;
            let confirmPassword = document.getElementById("confirmPassword").value;

            if (!facilityName || !currentPassword || !newPassword || !confirmPassword) {
                showMessage("施設名とすべてのパスワードを入力してください。", "error");
                return;
            }
            if (newPassword.length < 6) {
                showMessage("新しいパスワードは6文字以上にしてください。", "error");
                return;
            }
            if (newPassword !== confirmPassword) {
                showMessage("新しいパスワードが一致しません。", "error");
                return;
            }

            try {
                let facilityRef = doc(db, "facilities", facilityName);
                let facilitySnapshot = await getDoc(facilityRef);
                if (!facilitySnapshot.exists()) {
                    showMessage("施設名が見つかりません。", "error");
                    return;
                }
                if (facilitySnapshot.data().password !== currentPassword) {
                    showMessage("現在のパスワードが違います。", "error");
                    return;
                }
                await updateDoc(facilityRef, { password: newPassword });
                showMessage("パスワードを変更しました。ログイン画面から新しいパスワードでログインしてください。", "success");
                document.getElementById("currentPassword").value = "";
                document.getElementById("newPassword").value = "";
                document.getElementById("confirmPassword").value = "";
            } catch (error) {
                showMessage("変更に失敗しました。通信環境と入力内容を確認してください。", "error");
            }
        };
    </script>
</body>
</html>
